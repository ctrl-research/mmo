# Builds and publishes the split client and server images.
#
# Both are built from the same commit in the same run and share a tag set, so
# a given tag always names a client and a server compiled from one tree. That
# matters more here than in most projects: the client predicts using a WASM
# build of internal/world/sim and the server simulates with the Go build of
# the same package, and the two must agree bit for bit.
#
# Called by release.yml rather than triggered by the tag it creates. A tag
# pushed with GITHUB_TOKEN does not fire `on: push: tags` -- GitHub suppresses
# it to stop workflows triggering each other recursively -- so a tags trigger
# here would leave every automated release tagged and never built.

name: Images

on:
  workflow_call:
    inputs:
      version:
        description: SemVer to publish, without a v prefix.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to publish. Leave empty to publish only a sha- tag.
        type: string
        required: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      # One failing image should not cancel the other; a half-published pair is
      # easier to reason about when you can see which half failed and why.
      fail-fast: false
      matrix:
        include:
          - component: server
            dockerfile: deploy/Dockerfile.server
          - component: client
            dockerfile: deploy/Dockerfile.client

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          # type=semver reads the git ref, which is the branch here rather
          # than the tag, so the version is passed in explicitly instead.
          # Every image gets a sha- tag; the SemVer and latest tags only
          # appear when a version was supplied.
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache rather than type=gha. GHA cache blob keys are
          # content-addressed and GLOBAL -- `scope` namespaces the manifest,
          # not the blobs -- and both Dockerfiles open with the same
          # golang:1.26-alpine + `go mod download` stage. Run concurrently,
          # the two jobs reserve identical blob keys at the same moment and
          # one loses with "failed to reserve cache". Registry cache writes to
          # a distinct ref per component, so there is nothing to contend on.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/cache:${{ matrix.component }}
          # ignore-error because a cache is an optimisation and a release is
          # not. Without it a cache-export failure fails the build AFTER the
          # image has been pushed and the tag already exists, which is exactly
          # how 0.1.0 ended up tagged with nothing published.
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/cache:${{ matrix.component }},mode=max,ignore-error=true
