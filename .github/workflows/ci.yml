name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Persistence is tested against real Postgres and Redis rather than
    # mocks. The behaviour that matters -- the fencing predicate, the unique
    # index on character names, Lua script atomicity -- lives in those
    # services. A mock would assert that the Go code calls the queries it
    # already calls, and would pass happily while the actual constraint was
    # wrong.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mmo
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: mmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmo -d mmo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MMO_TEST_DATABASE_URL: postgres://mmo:testpassword@localhost:5432/mmo?sslmode=disable
      MMO_TEST_REDIS_ADDR: localhost:6379

    steps:
      - uses: actions/checkout@v4

      # setup-go and setup-node cannot read .tool-versions: setup-go accepts
      # only go.mod, go.work, or .go-version, and passing it anything else
      # makes it treat the whole file -- comments included -- as a version
      # string. Parsing it here keeps .tool-versions the single source of
      # truth without duplicating the numbers into this file.
      - name: Read pinned toolchain versions
        id: versions
        run: |
          go_version=$(awk '$1 == "golang" { print $2 }' .tool-versions)
          node_version=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)

          # An empty value would let setup-go silently install some other
          # version, so a renamed or missing entry fails here instead.
          if [ -z "$go_version" ]; then
            echo "::error::No 'golang' entry in .tool-versions"
            exit 1
          fi
          if [ -z "$node_version" ]; then
            echo "::error::No 'nodejs' entry in .tool-versions"
            exit 1
          fi

          echo "go=$go_version" >> "$GITHUB_OUTPUT"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"
          echo "Go $go_version, Node $node_version"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.go }}

      - name: Lint protobuf
        run: go tool -modfile=tools/go.mod buf lint

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # A skipped database test looks identical to a passing one in the
      # summary, so assert the services are actually reachable. Otherwise a
      # broken service definition hides every persistence test behind a green
      # tick.
      - name: Verify test services are reachable
        run: |
          go test ./internal/store/ -run TestMigrationsApply -v 2>&1 | tee /tmp/store.log
          if grep -q "SKIP" /tmp/store.log; then
            echo "::error::Database tests skipped; the Postgres service is not reachable"
            exit 1
          fi
          go test ./internal/directory/ -run TestAcquireGivesExclusiveOwnership -v 2>&1 | tee /tmp/dir.log
          if grep -q "skipping Redis" /tmp/dir.log; then
            echo "::error::Redis lease tests skipped; the Redis service is not reachable"
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  client:
    name: Client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # setup-go and setup-node cannot read .tool-versions: setup-go accepts
      # only go.mod, go.work, or .go-version, and passing it anything else
      # makes it treat the whole file -- comments included -- as a version
      # string. Parsing it here keeps .tool-versions the single source of
      # truth without duplicating the numbers into this file.
      - name: Read pinned toolchain versions
        id: versions
        run: |
          go_version=$(awk '$1 == "golang" { print $2 }' .tool-versions)
          node_version=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)

          # An empty value would let setup-go silently install some other
          # version, so a renamed or missing entry fails here instead.
          if [ -z "$go_version" ]; then
            echo "::error::No 'golang' entry in .tool-versions"
            exit 1
          fi
          if [ -z "$node_version" ]; then
            echo "::error::No 'nodejs' entry in .tool-versions"
            exit 1
          fi

          echo "go=$go_version" >> "$GITHUB_OUTPUT"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"
          echo "Go $go_version, Node $node_version"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.go }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      # One schema generates both the Go and the TypeScript types, so this
      # check lives here rather than in the server job: buf comes from
      # tools/go.mod, but protoc-gen-es comes from client/node_modules, and
      # this is the only job with both toolchains installed.
      - name: Verify generated code is up to date
        run: |
          go tool -modfile=tools/go.mod buf generate
          if ! git diff --exit-code -- internal/wire client/src/gen; then
            echo "::error::Generated code is stale. Run 'make generate' and commit the result."
            exit 1
          fi

      - name: Build the simulation as WebAssembly
        run: make wasm

      # The check that makes client-side prediction trustworthy: the WASM the
      # client predicts with must produce bit-identical results to the Go build
      # the server runs. Divergence here is a hard failure, not a warning --
      # while it fails, prediction cannot be relied on.
      - name: WASM conformance against the Go golden corpus
        run: npm test
        working-directory: client

      - name: Typecheck
        run: npm run typecheck
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for committed secrets
        run: |
          if git grep -lE 'PRIVATE_KEY|AWS_SECRET|BEGIN RSA' -- ':!.github/workflows'; then
            echo "::error::Possible secret committed"
            exit 1
          fi

      - name: Validate content
        run: |
          for f in $(find content -name '*.tmj'); do
            python3 -c "import json,sys; json.load(open('$f'))" \
              || { echo "::error::Invalid JSON in $f"; exit 1; }
          done
