max_rank = 1
cooldown_ms = 1000
animation = "cast_nova"
tags = ["attack", "physical", "boss"]

[skill.king_quake.targeting]
kind = "circle"
range = 300.0
max_targets = 8

[[skill.king_quake.effects]]
type = "damage"
element = "physical"
base = { min = 20, max = 30 }

[[skill.king_quake.effects]]
type = "knockback"
speed = 14.0
distance = 8.0

# Cast on entering the last phase, on the king itself: the visible sign that
