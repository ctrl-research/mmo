# Global tuning constants.
#
# Anything a designer might want to change lives here rather than as a literal
# in Go. A magic number in code is a number nobody can tune without a deploy,
# and every one of them eventually needs tuning.

[combat]
# Critical hits multiply damage by this.
crit_multiplier = 1.5

# Elemental resistance is capped below 1.0 so stacking it can never reach
# immunity. 0.75 is Path of Exile's cap, and it works: resistance is valuable
# without ever being a solved problem.
resistance_cap = 0.75

# Armour reduces damage by armour / (armour + divisor * incoming). Strong
# against many small hits, weak against one large one -- which is what gives
# armour and resistance genuinely different roles rather than being two words
# for the same thing.
armour_divisor = 10

# Damage floor after all mitigation, so a hit always registers. Zero-damage
# hits read as broken even when they are correct.
min_damage = 1

hit_flash_ms = 150
corpse_ms = 600

# How long a character lies at zero health before they may return.
#
# A delay rather than an instant respawn: a fight you can rejoin the moment you
# lose it is a fight with no stakes. Eight seconds is long enough to feel like
# a loss and short enough not to be a punishment for its own sake -- and in a
# party it is the window someone else has to finish what you started.
downed_ms = 8000

# How long a character who has just come back cannot be harmed.
#
# A spawn point is a fixed place, and something is usually standing on it.
# Without this, coming back next to whatever killed you means dying again
# before you can move, and paying the penalty each time -- a loop with no way
# out. It ends the moment they attack, so it buys a chance to leave rather than
# a free opening.
revive_grace_ms = 2500

# Regeneration, as a share of maximum restored per second.
#
# Two mana rates rather than one. With none at all a caster who spends their
# mana can never attack again; with a single generous rate there is never a
# reason to stop casting. The lower in-combat rate makes a long fight something
# to pace, and the higher out-of-combat one means the pacing is recovered by
# stepping away rather than by logging out.
#
# At these values a full mana bar refills in about fifty seconds standing
# still, and a fight sustains roughly a fifth of that.
mana_regen = 0.02
mana_regen_in_combat = 0.004

# Health comes back out of combat only. Regenerating mid-fight would undo the
# fight -- and slowly, because the alternative to walking away and waiting is
# supposed to be a potion or a healer, not patience.
life_regen = 0.01

# How long after taking damage a character counts as being in combat.
combat_ms = 6000

# The share of progress toward the current level lost on death.
#
# Of progress *within* the level, not of total experience. A death therefore
# never costs a level, and never costs a level 90 character forty times what it
# costs a level 10 one -- which is what a flat percentage of total experience
# would do, and is how a death penalty turns into a reason to stop playing.
death_exp_penalty = 0.10

[drops]
ground_ms = 120000
pickup_range = 48.0

# Drops scatter rather than stacking in one unclickable pile.
scatter_range = 40.0

[party]
exp_share_range = 600.0
max_size = 6

# Under round-robin loot, how long a drop is reserved for the member it was
# assigned to. After it, anyone in the party may take it, so somebody who has
# stepped away does not leave loot on the floor for the rest of the night.
loot_lock_ms = 20000

[rooms]
# How close a player must be for a spawn point to produce mobs. Wider than
# half a viewport, so mobs are already there when the screen reaches them
# rather than appearing out of nothing in front of the player.
spawn_activation_range = 800.0

# How long a room runs empty before it stops. Long enough that stepping
# through a portal and back finds the room you left, with its mobs where you
# left them, rather than a fresh one.
idle_ms = 60000

[chat]
# The longest message accepted, in characters rather than bytes: a byte limit
# quietly gives players of some languages less to say than others.
max_length = 300

# Sustained rate per channel. They cost different amounts to send -- a global
# line reaches everyone online, a local one reaches a room -- so one shared
# limit would either strangle local chat or leave global wide open. Buckets
# start full, so a burst on arriving is not punished.
[chat.per_minute]
local = 30
global = 6
whisper = 20
party = 30
guild = 30
