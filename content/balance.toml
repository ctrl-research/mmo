# Global tuning constants.
#
# Anything a designer might want to change lives here rather than as a literal
# in Go. A magic number in code is a number nobody can tune without a deploy,
# and every one of them eventually needs tuning.

[combat]
# Critical hits multiply damage by this.
crit_multiplier = 1.5

# Elemental resistance is capped below 1.0 so stacking it can never reach
# immunity. 0.75 is Path of Exile's cap, and it works: resistance is valuable
# without ever being a solved problem.
resistance_cap = 0.75

# Armour reduces damage by armour / (armour + divisor * incoming). Strong
# against many small hits, weak against one large one -- which is what gives
# armour and resistance genuinely different roles rather than being two words
# for the same thing.
armour_divisor = 10

# Damage floor after all mitigation, so a hit always registers. Zero-damage
# hits read as broken even when they are correct.
min_damage = 1

hit_flash_ms = 150
corpse_ms = 600

[drops]
ground_ms = 120000
pickup_range = 48.0

# Drops scatter rather than stacking in one unclickable pile.
scatter_range = 40.0

[party]
exp_share_range = 600.0
max_size = 6

# Under round-robin loot, how long a drop is reserved for the member it was
# assigned to. After it, anyone in the party may take it, so somebody who has
# stepped away does not leave loot on the floor for the rest of the night.
loot_lock_ms = 20000

[rooms]
# How close a player must be for a spawn point to produce mobs. Wider than
# half a viewport, so mobs are already there when the screen reaches them
# rather than appearing out of nothing in front of the player.
spawn_activation_range = 800.0

# How long a room runs empty before it stops. Long enough that stepping
# through a portal and back finds the room you left, with its mobs where you
# left them, rather than a fresh one.
idle_ms = 60000

[chat]
# The longest message accepted, in characters rather than bytes: a byte limit
# quietly gives players of some languages less to say than others.
max_length = 300

# Sustained rate per channel. They cost different amounts to send -- a global
# line reaches everyone online, a local one reaches a room -- so one shared
# limit would either strangle local chat or leave global wide open. Buckets
# start full, so a burst on arriving is not punished.
[chat.per_minute]
local = 30
global = 6
whisper = 20
party = 30
guild = 30
