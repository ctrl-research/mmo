# Mob definitions.
#
# AI profiles are Go state machines; everything here is parameters. A handful
# of profiles covers most mobs, and bosses get bespoke profiles in M7 because a
# boss's mechanics *are* the encounter.

[mob.slime_green]
name = "Green Slime"
level = 3
hp = 60
attack = 4
armour = 2
exp = 12
width = 32.0
height = 28.0
drop_table = "slime_green"

[mob.slime_green.ai]
profile = "aggressive_melee"
aggro_range = 180.0
leash_range = 420.0
attack_range = 40.0

# Per second; converted to per tick at load so the simulation never divides by
# a tick rate at runtime.
move_speed = 45.0

# Idle mobs run their behaviour on a slower beat. Under per-player layering a
# room holds roughly layers x mobs entities and most are idle at any moment, so
# this is the largest saving available -- and it is invisible in play, because
# an idle mob has nothing to decide.
idle_tick_interval = 8

[[mob.slime_green.abilities]]
skill = "mob_bite"
weight = 1
cooldown_ms = 1400

[mob.boar_wild]
name = "Wild Boar"
level = 8
hp = 140
attack = 11
armour = 6
exp = 34
width = 44.0
height = 36.0
drop_table = "boar_wild"

[mob.boar_wild.ai]
profile = "aggressive_melee"
aggro_range = 260.0
leash_range = 560.0
attack_range = 48.0
move_speed = 70.0
idle_tick_interval = 8

[[mob.boar_wild.abilities]]
skill = "mob_bite"
weight = 1
cooldown_ms = 1100

# Placed on a shared spawn point in the tutorial map, so everyone in the room
# fights the same one. It is the counterweight to per-player mobs: without
# shared-layer content a hunting zone reads as single-player with chat.
[mob.slime_king]
name = "Slime King"
level = 12
hp = 6000
attack = 18
armour = 10
exp = 4000
width = 64.0
height = 56.0
drop_table = "slime_king"

# The profile is "boss", which means the ordinary chase-attack-leash machine is
# replaced by the encounter below. A boss does not leash and does not heal
# itself by walking home: an arena fight that resets because someone pulled it
# four tiles too far is a fight decided by geometry rather than by play.
[mob.slime_king.ai]
profile = "boss"
aggro_range = 520.0
leash_range = 4000.0
attack_range = 120.0
move_speed = 55.0
idle_tick_interval = 1

# Phases are entered as health falls and never left. Each lists what the king
# can do while it is in that phase, so the fight changes shape three times
# rather than being one rotation with bigger numbers.

[[mob.slime_king.phases]]
name = "The King Stirs"
at_hp_percent = 100

[[mob.slime_king.phases.abilities]]
skill = "king_slam"
cooldown_ms = 4000
telegraph_ms = 700
target = "current"

[[mob.slime_king.phases.abilities]]
skill = "king_spit"
cooldown_ms = 6000
telegraph_ms = 500
target = "random"

# Two thirds down, the throne cracks. Throneshock scatters the party as the
# phase opens, and from here the king starts asking for everyone at once.
[[mob.slime_king.phases]]
name = "The Throne Cracks"
at_hp_percent = 65
on_enter = "king_quake"

[[mob.slime_king.phases.abilities]]
skill = "king_crush"
cooldown_ms = 13000
telegraph_ms = 1600
target = "self"

[[mob.slime_king.phases.abilities]]
skill = "king_slam"
cooldown_ms = 4000
telegraph_ms = 700
target = "current"

[[mob.slime_king.phases.abilities]]
skill = "king_spit"
cooldown_ms = 5000
telegraph_ms = 500
target = "farthest"

# Cornered. Harden makes the fight longer; the enrage clock makes that a
# problem. Ninety seconds is enough to finish a king already at a third health
# and not enough to wait one out.
[[mob.slime_king.phases]]
name = "Cornered"
at_hp_percent = 30
on_enter = "king_harden"
enrage_after_ms = 90000
enrage_buff = "king_frenzy"

[[mob.slime_king.phases.abilities]]
skill = "king_crush"
cooldown_ms = 9000
telegraph_ms = 1300
target = "self"

[[mob.slime_king.phases.abilities]]
skill = "king_sweep"
cooldown_ms = 8000
telegraph_ms = 900
target = "farthest"

[[mob.slime_king.phases.abilities]]
skill = "king_slam"
cooldown_ms = 3000
telegraph_ms = 600
target = "current"
