# Base item types.
#
# `slot` is where equipment is worn; `class` decides which affixes may roll on
# it. They are separate because two slots can share an affix pool and one slot
# can hold several classes -- a sword and an axe both go in the weapon slot but
# need not share every modifier.
#
# Implicits are rolled per instance like affixes, so two iron swords are not
# identical. That is what makes a base type worth re-examining rather than a
# solved quantity.

# --- consumables and materials ----------------------------------------------

[item."potion.red_small"]
name = "Small Red Potion"
kind = "consumable"
stackable = true
max_stack = 100
level = 1

[item."potion.blue_small"]
name = "Small Blue Potion"
kind = "consumable"
stackable = true
max_stack = 100
level = 1

[item."material.slime_gel"]
name = "Slime Gel"
kind = "material"
stackable = true
max_stack = 500
level = 1

[item."material.boar_hide"]
name = "Boar Hide"
kind = "material"
stackable = true
max_stack = 500
level = 5

# --- weapons ----------------------------------------------------------------

[item."weapon.rusty_sword"]
name = "Rusty Sword"
kind = "equipment"
slot = "weapon"
class = "sword"
level = 1

[[item."weapon.rusty_sword".implicit]]
stat = "attack"
kind = "flat"
min = 3
max = 6

[item."weapon.iron_sword"]
name = "Iron Sword"
kind = "equipment"
slot = "weapon"
class = "sword"
level = 8

[[item."weapon.iron_sword".implicit]]
stat = "attack"
kind = "flat"
min = 8
max = 14

[item."weapon.war_axe"]
name = "War Axe"
kind = "equipment"
slot = "weapon"
class = "axe"
level = 12

[[item."weapon.war_axe".implicit]]
stat = "attack"
kind = "flat"
min = 14
max = 22

# Slower but harder hitting, so weapon choice is a trade rather than a ladder.
[[item."weapon.war_axe".implicit]]
stat = "attack_speed"
kind = "increased"
min = -0.15
max = -0.05

