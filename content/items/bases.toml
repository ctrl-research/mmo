# --- tools ------------------------------------------------------------------
#
# A tool's `power` both gates and speeds: a node may demand a minimum, and
# whatever is above that adds a percentage point to the per-action-tick chance.
# One number doing both jobs deliberately -- separate "tier" and "speed"
# numbers would let content define a tool that unlocks a node it is then too
# slow to work, which is a tool nobody would ever equip.
#
# They go in the weapon slot, so gathering with an axe out means not having a
# sword out. That is a real trade rather than a free extra slot, and it is the
# reason a tool has an attack implicit at all: a woodcutter who wanders into a
# boar should not be completely defenceless.

[item."tool.bronze_axe"]
name = "Bronze Axe"
kind = "equipment"
slot = "weapon"
class = "axe"
level = 1

[item."tool.bronze_axe".tool]
skill = "woodcutting"
power = 1

[[item."tool.bronze_axe".implicit]]
stat = "attack"
kind = "flat"
min = 2
max = 4

