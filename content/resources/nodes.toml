# Resource nodes.
#
# A node's behaviour lives here; where one stands lives on the map. That split
# is what makes retuning oak trees one edit rather than one per tree.
#
# `chance_at_level` and `chance_at_max` are the per-action-tick chance of a
# yield at the node's own required level and at level 99, interpolated linearly
# between. Two authored points rather than a formula because two points are
# what a designer can reason about: "a new player gets a log every few seconds,
# a maxed one nearly every tick" is a sentence, and a curve exponent is not.
#
# `yields` is how many times a node can be gathered before it is spent. A node
# that never depleted would be one player standing still forever -- OSRS
# handles this by making trees fall over, and so do we.
#
# `min_tool_power` gates on equipment rather than on level. Power above the
# requirement is added to the chance at one percentage point per point, so a
# better axe is both a key and a speed-up, and the next one up is always worth
# buying.

# --- woodcutting ------------------------------------------------------------

[node.tree_oak]
name = "Oak Tree"
skill = "woodcutting"
level = 1
exp = 25
item = "material.oak_log"
qty = 1
chance_at_level = 22
chance_at_max = 70
min_tool_power = 1
yields = 4
respawn_ms = 12000

[node.tree_willow]
name = "Willow Tree"
skill = "woodcutting"
level = 15
exp = 68
item = "material.willow_log"
qty = 1
chance_at_level = 16
chance_at_max = 58
min_tool_power = 3
yields = 6
respawn_ms = 16000

