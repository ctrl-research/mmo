# Weapon affixes.
#
# Each affix is one stat modifier at several tiers. A tier bounds the value
# range and the item level at which it becomes available, which is what makes a
# high-level drop meaningfully different from a low-level one rather than
# merely bigger.
#
# Tier 1 is the strongest. Higher tiers carry lower weights, so the good rolls
# stay rare without being unreachable.

# --- prefixes ---------------------------------------------------------------

[affix.weapon_flat_attack]
name = "Heavy"
type = "prefix"
classes = ["sword", "axe", "mace"]
stat = "attack"
kind = "flat"

[[affix.weapon_flat_attack.tiers]]
tier = 3
item_level = 1
min = 2
max = 5
weight = 100

[[affix.weapon_flat_attack.tiers]]
tier = 2
item_level = 10
min = 6
max = 11
weight = 45

[[affix.weapon_flat_attack.tiers]]
tier = 1
item_level = 25
min = 12
max = 20
weight = 15

[affix.weapon_increased_attack]
name = "Tempered"
type = "prefix"
classes = ["sword", "axe", "mace"]
stat = "attack"
kind = "increased"

[[affix.weapon_increased_attack.tiers]]
