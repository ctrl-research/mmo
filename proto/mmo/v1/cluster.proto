syntax = "proto3";

package mmo.v1;

option go_package = "github.com/ctrl-research/mmo/internal/wire/mmo/v1;mmov1";

// Messages between server components.
//
// Kept separate from game.proto because these are a different contract with a
// different audience: the client never sees them, and the client's generated
// TypeScript should not grow every time a server-internal message is added.

// BusEnvelope wraps a payload with the addressing a request needs.
//
// The bus is publish/subscribe, which has no notion of a reply. Request and
// response is built on top: the requester subscribes to a private inbox
// subject, names it here, and the responder publishes there.
message BusEnvelope {
  // ReplyTo is the subject a response should be published to. Empty for a
  // one-way publish.
  string reply_to = 1;

  // CorrelationId matches a response to its request. Necessary even with a
  // private inbox, because a late reply to a timed-out request would
  // otherwise be mistaken for the answer to the next one.
  string correlation_id = 2;

  bytes payload = 3;

  // Error carries a failure back to the requester, so a responder can refuse
  // without the requester waiting out its timeout.
  string error = 4;
}

// TransferRequest hands a character from one world node to another.
//
// The protocol is the same whether the destination is on this node or another
// one. A local fast path would mean the distributed path is never exercised
// until the day it has to work (docs/architecture.md, AGENTS.md invariant 2).
message TransferRequest {
  string character_id = 1;
  string account_id = 2;
  string name = 3;

  // Where the character is going.
  //
  // spawn_point names an entrance; waypoint_id names a fast-travel
  // destination, which the destination resolves from its own copy of the
  // content rather than trusting coordinates off the wire. Both empty means
  // the character keeps the position in state, which is what a channel switch
  // wants: the same map, the same spot, a different instance.
  string map_id = 4;
  string spawn_point = 5;
  uint64 instance_id = 6;
  string waypoint_id = 12;

  // Which hostile-entity layer to join: the party ID while partied, the
  // character ID otherwise. Sent rather than looked up at the destination,
  // because arriving in the character's own layer and being re-keyed a moment
  // later would spawn a whole mob population nobody ever sees.
  string layer_key = 13;

  // Progression, which has its own database columns.
  uint32 level = 7;
  int64 exp = 8;
  int64 gold = 9;

  // The simulation state -- position, velocity, vitals -- as stored.
  bytes state = 10;

  // The fencing token the source holds. The destination refuses a token that
  // is not at least as high as one it has already seen, which is what stops a
  // replayed or delayed transfer resurrecting a character somewhere it has
  // already left.
  int64 lease_token = 11;
}

message TransferReply {
  bool accepted = 1;

  // The entity the character was given in its new room.
  uint32 entity_id = 2;

  // Which node accepted it, for logging and for routing afterwards.
  string node_id = 3;

  string error = 4;
}

// RoomClosed announces that an instance has been torn down, so the directory
// and anything holding a handle can stop referring to it.
message RoomClosed {
  uint64 instance_id = 1;
  string map_id = 2;
  string node_id = 3;
}

// HostRequest asks a node to start hosting a room instance.
//
// Needed because the directory, not the caller, decides which node hosts a
// room. A gateway placing a player into a map may be told the instance belongs
// to a node other than its own, and that node has to be running the room
// before anyone can join it.
message HostRequest {
  uint64 instance_id = 1;
  string map_id = 2;
}

message HostReply {
  bool hosting = 1;
  string node_id = 2;
  string error = 3;
}

// ChatDelivery carries one line of chat between nodes.
//
// Everything but local chat crosses node boundaries: the recipients of a
// global line, a whisper, or a party message are wherever they happen to be
// logged in, and the sender's node has no way to reach them except through the
// bus. Local chat never appears here -- it is delivered inside the room, which
// is the whole meaning of the channel.
message ChatDelivery {
  // Channel is the game's ChatChannel, carried as an int so cluster.proto does
  // not have to import the client-facing schema. The gateway is the only thing
  // that turns it back into a typed value.
  uint32 channel = 1;

  string from_character_id = 2;
  string from_name = 3;
  string body = 4;
  int64 server_time_ms = 5;

  // ToCharacterId addresses a whisper. Empty on broadcast channels.
  string to_character_id = 6;
}

// PartyUpdate announces that a party changed, to every node holding a member.
//
// It carries the whole party rather than a delta for the same reason the
// client-facing PartyState does: it is at most six members, and a node that
// misses one incremental update would hold a roster that is quietly wrong.
message PartyUpdate {
  string party_id = 1;
  string leader_character_id = 2;
  repeated PartyMemberInfo members = 3;

  // Disbanded marks the last update a party will ever send, so a node can drop
  // its subscription rather than waiting to notice nothing arrives.
  bool disbanded = 4;

  // Notice is what to tell the members happened, already phrased: "Alice
  // joined the party". Composed by the node that made the change, because it
  // is the only one that knows which change it was.
  string notice = 5;

  // Loot is how drops are assigned: "free-for-all" or "round-robin".
  string loot = 6;
}

message PartyMemberInfo {
  string character_id = 1;
  string name = 2;
}

// PartyVitals is one member's health and whereabouts, pushed on a slow beat so
// member frames are useful for somebody in another room.
//
// Separate from PartyUpdate because it is the only part that changes
// continuously: folding it in would mean a roster broadcast every second.
message PartyVitals {
  string character_id = 1;
  uint32 level = 2;
  uint32 hp = 3;
  uint32 hp_max = 4;
  string map_id = 5;
  bool online = 6;
}

// GuildUpdate tells every node holding a member that a guild changed.
//
// It carries no roster: unlike a party, a guild can have hundreds of members,
// and broadcasting the whole thing on every join would be a lot of bytes for
// something each node can read from Postgres. It says what changed and lets
// the nodes that care reload.
message GuildUpdate {
  string guild_id = 1;

  // Notice is what to tell the members, already phrased.
  string notice = 2;

  // Disbanded marks the last update a guild will send.
  bool disbanded = 3;
}

// ---------------------------------------------------------------------------
// Driving a room in another process.
//
// A session lives on the node the player is connected to; the room it is in may
// be hosted anywhere. Everything below is the room.Handle interface and its two
// callback interfaces (room.Sink and room.SessionEvents) put on the wire, so
// the two can be in different processes.
//
// Values that come from content -- portals, stations, recipes, dungeons --
// travel as identifiers and are resolved from the receiving node's own content,
// the same way an incoming transfer resolves its spawn point. Sending the
// resolved object instead would make the wire format grow with the game's
// content, and would let two nodes running different builds disagree silently
// about what a station makes.
// ---------------------------------------------------------------------------

// RoomEntity addresses one character inside one room instance.
message RoomEntity {
  uint64 instance_id = 1;
  uint32 entity_id = 2;
}

// WireProgress is room.Progress.
message WireProgress {
  int32 level = 1;
  int64 exp = 2;
  int64 gold = 3;
  string map_id = 4;
}

// WireLoadoutSlot is one skill on the bar.
message WireLoadoutSlot {
  string skill_id = 1;
  int32 rank = 2;
  repeated string supports = 3;
}

// WireVec is a position.
message WireVec {
  int32 x = 1;
  int32 y = 2;
}

// WireStats is a stats.Block, as its four parallel arrays.
//
// Indexed by StatID rather than named, because the block is an array and a
// map keyed by name would have to agree about names across a deploy. The
// arrays are sent whole: they are short, and a sparse encoding would need the
// same length check to be safe anyway.
message WireStats {
  repeated int64 base = 1;
  repeated int64 flat = 2;
  repeated int64 increased = 3;
  repeated int64 more = 4;
}

// WireDerived is everything the session computes from equipment.
message WireDerived {
  WireStats block = 1;
  uint32 max_hp = 2;
  map<string, int32> tool_power = 3;
}

// WireSnapshot is room.Snapshot: what a checkpoint writes.
message WireSnapshot {
  WireProgress progress = 1;

  // State is the room's own JSON encoding, reused rather than re-modelled:
  // it is already the format a checkpoint writes to the database, and a second
  // encoding of the same thing is a second place for the two to disagree.
  bytes state = 2;

  map<string, int64> secondary = 3;
}

// WireJoinSpec is room.JoinSpec, minus the parts that cannot travel.
//
// Sink and Events are in-process references, so they are not here: a remote
// join attaches its connection afterwards, which is the same order a transfer
// already uses.
message WireJoinSpec {
  string character_id = 1;
  string name = 2;
  WireProgress progress = 3;
  bytes state = 4;
  bool fresh = 5;
  repeated WireLoadoutSlot loadout = 6;
  string layer_key = 7;
  repeated string known_waypoints = 8;
  map<string, int64> secondary = 9;
  WireVec spawn = 10;
  bool arrived = 11;
}

// RoomCommand is one call on room.Handle.
//
// One message with a oneof rather than a subject per method: the room is the
// thing being addressed, and a subject per method would multiply subscriptions
// by sixteen for no routing benefit.
message RoomCommand {
  uint64 instance_id = 1;

  // CallbackSubject is where this room should publish everything it sends back
  // to the session -- snapshots, chat, loot claims. Set on Join and Attach,
  // which are the two calls that give a character a connection.
  string callback_subject = 2;

  oneof body {
    JoinCommand join = 10;
    CaptureCommand capture = 11;
    FreezeCommand freeze = 12;
    AttachCommand attach = 13;
    SetLoadoutCommand set_loadout = 14;
    SetStatsCommand set_stats = 15;
    ResolveLootCommand resolve_loot = 16;
    AbortTransferCommand abort_transfer = 17;
    LeaveCommand leave = 18;
    InputCommand input = 19;
    CastCommand cast = 20;
    InteractCommand interact = 21;
    CraftCommand craft = 22;
    ResolveCraftCommand resolve_craft = 23;
    SayCommand say = 24;
    SetLayerCommand set_layer = 25;
  }
}

message JoinCommand { WireJoinSpec spec = 1; }
message CaptureCommand { uint32 entity_id = 1; }
message FreezeCommand { uint32 entity_id = 1; }

message AttachCommand {
  uint32 entity_id = 1;
  repeated WireLoadoutSlot loadout = 2;
  string layer_key = 3;
  repeated string known_waypoints = 4;
  map<string, int64> secondary = 5;

  // HasSecondary and HasWaypoints distinguish "leave what the room has" from
  // "set it to nothing". A nil map and an empty one mean different things here
  // and proto3 cannot tell them apart.
  bool has_secondary = 6;
  bool has_waypoints = 7;
}

message SetLoadoutCommand {
  uint32 entity_id = 1;
  repeated WireLoadoutSlot slots = 2;
}

message SetStatsCommand {
  uint32 entity_id = 1;
  WireDerived derived = 2;
}

message ResolveLootCommand {
  uint32 player = 1;
  uint32 drop_id = 2;
  bool granted = 3;
  string reason = 4;
}

message AbortTransferCommand {
  uint32 entity_id = 1;
  string reason = 2;
}

message LeaveCommand { uint32 entity_id = 1; }

message InputCommand {
  uint32 entity_id = 1;
  uint32 seq = 2;
  int32 move_x = 3;
  bool jump = 4;
  bool up = 5;
  bool down = 6;
}

message CastCommand {
  uint32 entity_id = 1;
  string skill_id = 2;
  bool facing_left = 3;
}

message InteractCommand {
  uint32 entity_id = 1;
  uint32 target = 2;
  uint32 kind = 3;
}

message CraftCommand {
  uint32 entity_id = 1;
  uint32 station = 2;
  string recipe_id = 3;
}

message ResolveCraftCommand {
  uint32 player = 1;
  bool made = 2;
  string reason = 3;
}

message SayCommand {
  uint32 entity_id = 1;
  string body = 2;
  int64 at_millis = 3;
}

message SetLayerCommand {
  uint32 entity_id = 1;
  string key = 2;
  uint32 loot = 3;
}

// RoomCommandReply answers the three commands that return something.
//
// The others are fire-and-forget by design: Input arrives every client tick,
// and a round trip per input would put the network between a keypress and the
// simulation.
message RoomCommandReply {
  // Error is a failure of the call itself, as opposed to a refusal the caller
  // is expected to handle -- those come back in the fields below.
  string error = 1;

  // Join
  uint32 entity_id = 2;

  // Capture
  WireSnapshot snapshot = 3;
  bool found = 4;

  // Attach
  bool attached = 5;

  // Closed reports that the room is gone, so the caller can retry placement
  // rather than treating it as an error. It is room.ErrRoomClosed, which the
  // join path already retries on locally.
  bool closed = 6;
}

// RoomCallback is everything a room sends back to the session driving it:
// room.Sink and room.SessionEvents on one subject.
//
// One subject and one message, because they share an ordering requirement --
// a loot claim that overtook the snapshot showing the drop would be a claim
// for something the player has not seen yet.
message RoomCallback {
  uint32 entity_id = 1;

  oneof body {
    // Send carries an already-encoded game.v1 ServerMessage rather than the
    // typed message, so cluster.proto does not import the client-facing
    // schema -- the same separation ChatDelivery keeps. It is also one fewer
    // encode: the room hands over bytes it would have had to produce anyway.
    bytes send = 10;
    SinkClose close = 11;
    LootClaimEvent claim_loot = 12;
    PortalEvent enter_portal = 13;
    WaypointEvent discover_waypoint = 14;
    StationEvent open_station = 15;
    CraftEvent run_craft = 16;
    GatherEvent grant_gather = 17;
    RunEndEvent end_run = 18;
  }
}

message SinkClose {
  uint32 code = 1;
  string reason = 2;
}

message LootClaimEvent {
  uint32 player = 1;
  string character_id = 2;
  uint32 drop_id = 3;

  // Instance is the item's own JSON encoding -- the same one the database
  // stores, for the same reason WireSnapshot reuses the room's.
  bytes instance = 4;
  uint64 tick = 5;
}

message PortalEvent {
  uint32 player = 1;
  string character_id = 2;

  // The portal is named by the map it is in and its position in that map's
  // list, and resolved from the receiving node's content.
  string map_id = 3;
  uint32 portal_index = 4;
  uint64 tick = 5;
}

message WaypointEvent {
  uint32 player = 1;
  string character_id = 2;
  string waypoint_id = 3;
}

message StationEvent {
  uint32 player = 1;
  string character_id = 2;
  string station_id = 3;
  uint32 entity_id = 4;
  map<string, int32> levels = 5;
}

message CraftEvent {
  uint32 player = 1;
  string character_id = 2;
  string recipe_id = 3;
  uint64 tick = 4;
}

message GatherEvent {
  uint32 player = 1;
  string character_id = 2;
  string skill = 3;
  string item_id = 4;
  int32 qty = 5;
  uint64 tick = 6;
}

message RunEndEvent {
  uint32 player = 1;
  string character_id = 2;
  string dungeon_id = 3;
  bool cleared = 4;
}

// ---------------------------------------------------------------------------
// Driving a character from another process.
//
// The other half of the role split. A gateway terminates the socket and knows
// nothing about rooms; a world node owns the character -- its lease, its
// checkpoints, its party and guild, and the room it is standing in.
//
// The gateway does the validating and clamping, because that is the trust
// boundary and it is where the untrusted bytes arrive. What crosses is the
// already-checked request, which is why these mirror the Go request types
// rather than the client's messages.
// ---------------------------------------------------------------------------

// EnterRequest asks a world node to take ownership of a character.
message EnterRequest {
  string account_id = 1;
  string character_id = 2;

  // CallbackSubject is where everything bound for the player's screen should
  // be published. The socket lives on the gateway and cannot travel, so this
  // is the address that stands in for it.
  string callback_subject = 3;
}

message EnterReply {
  string error = 1;

  // Busy distinguishes "somebody else is playing this character" from a
  // failure, because the two need different words in front of a player.
  bool busy = 2;

  string name = 3;
  uint32 entity_id = 4;
}

message SessionCommand {
  string character_id = 1;

  oneof body {
    SessionInput input = 10;
    SessionCast cast = 11;
    SessionInteract interact = 12;
    SessionCraft craft = 13;
    SessionItemAction item_action = 14;
    SessionChat chat = 15;
    SessionParty party = 16;
    SessionGuild guild = 17;
    SessionSocial social = 18;
    SessionLoadout loadout = 19;
    SessionPassive passive = 20;
    SessionTravel travel = 21;
    SessionWorldMap world_map = 22;
    SessionClose close = 23;
    SessionDisconnect disconnect = 24;
  }
}

message SessionInput {
  uint32 seq = 1;
  int32 move_x = 2;
  bool jump = 3;
  bool up = 4;
  bool down = 5;
}

message SessionCast {
  string skill_id = 1;
  bool facing_left = 2;
}

message SessionInteract {
  uint32 target = 1;
  uint32 kind = 2;
}

message SessionCraft {
  uint32 station = 1;
  string recipe_id = 2;
}

message SessionItemAction {
  uint32 kind = 1;
  string item_id = 2;
  int32 slot = 3;

  // The equipment slot is a content identifier, not an index: a number would
  // mean something different the next time the slots are reordered.
  string equip_slot = 4;
}

message SessionChat {
  uint32 channel = 1;
  string body = 2;
  string target = 3;
}

message SessionParty {
  uint32 kind = 1;
  string target = 2;
}

message SessionGuild {
  uint32 kind = 1;
  string target = 2;
}

message SessionSocial {
  uint32 kind = 1;
  string target = 2;
}

message SessionLoadout {
  int32 slot = 1;
  string skill_id = 2;
  repeated string supports = 3;
}

message SessionPassive {
  int32 allocate = 1;
  int32 refund = 2;
  bool respec_all = 3;
}

message SessionTravel {
  string waypoint_id = 1;
  uint64 channel = 2;
  bool new_channel = 3;
}

message SessionWorldMap {}
message SessionClose {}
message SessionDisconnect {}

message SessionReply {
  // Error is a refusal the player is meant to see -- "you are not in a party",
  // "that costs more gold than you have". The gateway shows it rather than
  // treating it as a fault, which is why it is a field and not a bus error.
  string error = 1;

  // Gone reports that this node is not holding the character any more, so the
  // gateway can close the connection instead of talking to nobody.
  bool gone = 2;

  // WorldMap is an encoded game.v1 WorldMap, carried as bytes so cluster.proto
  // does not import the client-facing schema.
  bytes world_map = 3;
}

// SessionCallback is everything a world node sends to the gateway holding the
// socket.
message SessionCallback {
  oneof body {
    // Send is an encoded game.v1 ServerMessage, on its way to the player.
    bytes send = 1;
    SinkClose close = 2;

    // OwnershipLost carries the reason the character's lease went away. The
    // connection has to be closed rather than left playing a character this
    // node no longer owns.
    string ownership_lost = 3;
  }
}
