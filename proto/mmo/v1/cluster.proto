syntax = "proto3";

package mmo.v1;

option go_package = "github.com/ctrl-research/mmo/internal/wire/mmo/v1;mmov1";

// Messages between server components.
//
// Kept separate from game.proto because these are a different contract with a
// different audience: the client never sees them, and the client's generated
// TypeScript should not grow every time a server-internal message is added.

// BusEnvelope wraps a payload with the addressing a request needs.
//
// The bus is publish/subscribe, which has no notion of a reply. Request and
// response is built on top: the requester subscribes to a private inbox
// subject, names it here, and the responder publishes there.
message BusEnvelope {
  // ReplyTo is the subject a response should be published to. Empty for a
  // one-way publish.
  string reply_to = 1;

  // CorrelationId matches a response to its request. Necessary even with a
  // private inbox, because a late reply to a timed-out request would
  // otherwise be mistaken for the answer to the next one.
  string correlation_id = 2;

  bytes payload = 3;

  // Error carries a failure back to the requester, so a responder can refuse
  // without the requester waiting out its timeout.
  string error = 4;
}

// TransferRequest hands a character from one world node to another.
//
// The protocol is the same whether the destination is on this node or another
// one. A local fast path would mean the distributed path is never exercised
// until the day it has to work (docs/architecture.md, AGENTS.md invariant 2).
message TransferRequest {
  string character_id = 1;
  string account_id = 2;
  string name = 3;

  // Where the character is going.
  //
  // spawn_point names an entrance; waypoint_id names a fast-travel
  // destination, which the destination resolves from its own copy of the
  // content rather than trusting coordinates off the wire. Both empty means
  // the character keeps the position in state, which is what a channel switch
  // wants: the same map, the same spot, a different instance.
  string map_id = 4;
  string spawn_point = 5;
  uint64 instance_id = 6;
  string waypoint_id = 12;

  // Which hostile-entity layer to join: the party ID while partied, the
  // character ID otherwise. Sent rather than looked up at the destination,
  // because arriving in the character's own layer and being re-keyed a moment
  // later would spawn a whole mob population nobody ever sees.
  string layer_key = 13;

  // Progression, which has its own database columns.
  uint32 level = 7;
  int64 exp = 8;
  int64 gold = 9;

  // The simulation state -- position, velocity, vitals -- as stored.
  bytes state = 10;

  // The fencing token the source holds. The destination refuses a token that
  // is not at least as high as one it has already seen, which is what stops a
  // replayed or delayed transfer resurrecting a character somewhere it has
  // already left.
  int64 lease_token = 11;
}

message TransferReply {
  bool accepted = 1;

  // The entity the character was given in its new room.
  uint32 entity_id = 2;

  // Which node accepted it, for logging and for routing afterwards.
  string node_id = 3;

  string error = 4;
}

// RoomClosed announces that an instance has been torn down, so the directory
// and anything holding a handle can stop referring to it.
message RoomClosed {
  uint64 instance_id = 1;
  string map_id = 2;
  string node_id = 3;
}

// HostRequest asks a node to start hosting a room instance.
//
// Needed because the directory, not the caller, decides which node hosts a
// room. A gateway placing a player into a map may be told the instance belongs
// to a node other than its own, and that node has to be running the room
// before anyone can join it.
message HostRequest {
  uint64 instance_id = 1;
  string map_id = 2;
}

message HostReply {
  bool hosting = 1;
  string node_id = 2;
  string error = 3;
}

// ChatDelivery carries one line of chat between nodes.
//
// Everything but local chat crosses node boundaries: the recipients of a
// global line, a whisper, or a party message are wherever they happen to be
// logged in, and the sender's node has no way to reach them except through the
// bus. Local chat never appears here -- it is delivered inside the room, which
// is the whole meaning of the channel.
message ChatDelivery {
  // Channel is the game's ChatChannel, carried as an int so cluster.proto does
  // not have to import the client-facing schema. The gateway is the only thing
  // that turns it back into a typed value.
  uint32 channel = 1;

  string from_character_id = 2;
  string from_name = 3;
  string body = 4;
  int64 server_time_ms = 5;

  // ToCharacterId addresses a whisper. Empty on broadcast channels.
  string to_character_id = 6;
}

// PartyUpdate announces that a party changed, to every node holding a member.
//
// It carries the whole party rather than a delta for the same reason the
// client-facing PartyState does: it is at most six members, and a node that
// misses one incremental update would hold a roster that is quietly wrong.
message PartyUpdate {
  string party_id = 1;
  string leader_character_id = 2;
  repeated PartyMemberInfo members = 3;

  // Disbanded marks the last update a party will ever send, so a node can drop
  // its subscription rather than waiting to notice nothing arrives.
  bool disbanded = 4;

  // Notice is what to tell the members happened, already phrased: "Alice
  // joined the party". Composed by the node that made the change, because it
  // is the only one that knows which change it was.
  string notice = 5;

  // Loot is how drops are assigned: "free-for-all" or "round-robin".
  string loot = 6;
}

message PartyMemberInfo {
  string character_id = 1;
  string name = 2;
}

// PartyVitals is one member's health and whereabouts, pushed on a slow beat so
// member frames are useful for somebody in another room.
//
// Separate from PartyUpdate because it is the only part that changes
// continuously: folding it in would mean a roster broadcast every second.
message PartyVitals {
  string character_id = 1;
  uint32 level = 2;
  uint32 hp = 3;
  uint32 hp_max = 4;
  string map_id = 5;
  bool online = 6;
}

// GuildUpdate tells every node holding a member that a guild changed.
//
// It carries no roster: unlike a party, a guild can have hundreds of members,
// and broadcasting the whole thing on every join would be a lot of bytes for
// something each node can read from Postgres. It says what changed and lets
// the nodes that care reload.
message GuildUpdate {
  string guild_id = 1;

  // Notice is what to tell the members, already phrased.
  string notice = 2;

  // Disbanded marks the last update a guild will send.
  bool disbanded = 3;
}
