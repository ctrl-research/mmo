syntax = "proto3";

package mmo.v1;

option go_package = "github.com/ctrl-research/mmo/internal/wire/mmo/v1;mmov1";

// The wire protocol between the browser client and the gateway.
//
// See docs/protocol.md for the model this encodes. Two rules govern edits:
//
//  1. Field numbers are permanent. Never reuse one; reserve it instead. A
//     client and a server disagreeing about what field 7 means is a class of
//     bug that is hard to see and easy to avoid.
//  2. The client sends intent, never outcome. There is deliberately no message
//     here by which a client can report its own position or the damage it
//     dealt.

// ---------------------------------------------------------------------------
// Framing
// ---------------------------------------------------------------------------

// Envelope is exactly one WebSocket binary frame.
//
// The server batches a whole tick's messages into one envelope rather than
// sending each separately: at 20 Hz with a snapshot plus several events, the
// per-frame WebSocket overhead is otherwise a meaningful share of the traffic.
message Envelope {
  repeated ServerMessage server = 1;
  repeated ClientMessage client = 2;
}

message ClientMessage {
  oneof body {
    Hello  hello  = 1;
    Intent intent = 2;
    Ping   ping   = 3;
    Cast   cast   = 4;
    Interact interact = 5;
    ItemAction item_action = 6;
    OpenWorldMap open_world_map = 7;
    Travel travel = 8;
    ChatSend chat = 9;
    PartyAction party = 10;
    GuildAction guild = 11;
    SocialAction social = 12;
    SetSkillSlot skill_slot = 13;
    PassiveAction passive = 14;
  }
}

// Cast requests a skill. The client asks; the server decides.
//
// There is deliberately no field for a target or for damage. The server
// resolves what the cast hits from its own state and rolls the outcome itself,
// so a client can ask to swing but never assert what it connected with.
message Cast {
  uint32 seq = 1;       // client sequence, echoed for reconciliation
  string skill_id = 2;

  // Facing at the moment of the cast, since a swing resolves in the direction
  // the character is looking rather than at a chosen entity.
  bool facing_left = 3;
}

// Interact is a request to act on a nearby entity: loot a drop, use a portal,
// talk to an NPC.
message Interact {
  uint32 entity_id = 1;
  InteractKind kind = 2;
}

enum InteractKind {
  INTERACT_KIND_UNSPECIFIED = 0;
  INTERACT_KIND_LOOT = 1;
}

// ItemAction asks the server to move, equip, or destroy an item.
//
// The client names the item by its durable id and says what it wants done. It
// never says where the item ends up in the database, and never asserts what
// the resulting stats are -- the server decides both.
message ItemAction {
  ItemActionKind kind = 1;

  // The item instance to act on, for move, equip, and destroy.
  string item_id = 2;

  // Destination slot, for a move within the inventory.
  uint32 slot = 3;

  // Which equipment slot to clear, for unequip.
  string equip_slot = 4;
}

enum ItemActionKind {
  ITEM_ACTION_KIND_UNSPECIFIED = 0;
  ITEM_ACTION_KIND_MOVE = 1;
  ITEM_ACTION_KIND_EQUIP = 2;
  ITEM_ACTION_KIND_UNEQUIP = 3;
  ITEM_ACTION_KIND_DESTROY = 4;
}

message ServerMessage {
  oneof body {
    Welcome  welcome  = 1;
    Snapshot snapshot = 2;
    Event    event    = 3;
    Pong     pong     = 4;
    Kick     kick     = 5;
    Inventory inventory = 6;
  }
  reserved 7 to 9;
}

// ---------------------------------------------------------------------------
// Handshake
// ---------------------------------------------------------------------------

// Hello is the first message on a new connection.
message Hello {
  // Single-use ticket obtained over authenticated HTTP, valid for 30 seconds.
  // Credentials never appear in the WebSocket URL, where they would leak into
  // proxy logs and browser history.
  string ticket = 1;

  // Both sides must agree on the protocol shape and on the content that
  // describes the world, or the resulting bugs are nearly unreadable.
  uint32 protocol_version = 2;
  string content_hash = 3;
}

message Welcome {
  uint32 entity_id = 1;  // the player's own entity, to distinguish self
  uint64 instance_id = 2;
  uint64 tick = 3;       // server tick at the moment of joining
  uint32 tick_ms = 4;    // simulation period, so the client need not assume
  string map_id = 5;
  EntityState self = 6;
}

// Kick closes the connection with a reason the client can act on. The code
// mirrors the WebSocket close code; see docs/protocol.md for the table.
message Kick {
  uint32 code = 1;
  string reason = 2;
}

// ---------------------------------------------------------------------------
// Client input
// ---------------------------------------------------------------------------

// Intent is what buttons the player is holding. It carries no position: the
// server derives where the player is, which is what makes teleport and speed
// hacks unrepresentable rather than merely detectable.
message Intent {
  // Strictly increasing per connection. Echoed back as Snapshot.ack_seq to
  // drive client reconciliation. A sequence number needs no clock sync, and a
  // client that lies about it only corrupts its own prediction.
  uint32 seq = 1;

  // Highest snapshot tick this client has received, used as the delta
  // baseline. Riding on Intent means acknowledgements cost no extra messages.
  uint64 ack_snapshot = 2;

  // Horizontal intent in thousandths, clamped server-side to [-1000, 1000].
  sint32 move_x = 3;

  bool jump = 4;
  bool up = 5;
  bool down = 6;
}

message Ping {
  uint64 client_time_ms = 1;
}

message Pong {
  uint64 client_time_ms = 1;  // echoed, so the client can compute RTT
  uint64 server_tick = 2;
}

// ---------------------------------------------------------------------------
// World state
// ---------------------------------------------------------------------------

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_MOB = 2;
  ENTITY_KIND_DROP = 3;
  ENTITY_KIND_NPC = 4;

  // What the effect vocabulary spawns: a bolt in flight, and a patch of
  // ground that keeps applying something. Entities rather than a separate
  // list, so they interpolate and layer like everything else.
  ENTITY_KIND_PROJECTILE = 5;
  ENTITY_KIND_AREA = 6;

  // A telegraph: the ground marker a boss puts down before an attack lands.
  // An entity so it culls, layers, and interpolates like anything else, and
  // so its disappearance is the attack landing rather than a separate
  // message the client has to correlate.
  ENTITY_KIND_TELEGRAPH = 7;
}

// Bit positions in EntityDelta.field_mask.
enum EntityField {
  ENTITY_FIELD_UNSPECIFIED = 0;
  ENTITY_FIELD_POS = 1;
  ENTITY_FIELD_VEL = 2;
  ENTITY_FIELD_FLAGS = 3;
  ENTITY_FIELD_ANIM = 4;
  ENTITY_FIELD_HP = 5;
}

// Bit positions in EntityState.flags and EntityDelta.flags.
enum EntityFlag {
  ENTITY_FLAG_UNSPECIFIED = 0;
  ENTITY_FLAG_GROUNDED = 1;
  ENTITY_FLAG_CLIMBING = 2;
  ENTITY_FLAG_FACING_LEFT = 3;
  ENTITY_FLAG_JUMP_HELD = 4;
}

// EntityState is a complete entity, sent when it first becomes visible and
// whenever a full snapshot is due.
//
// Positions and velocities are raw Q24.8 fixed-point, the same representation
// the simulation uses internally, so serialisation neither rounds nor converts.
// Floating point appears nowhere in the movement path.
message EntityState {
  uint32 id = 1;
  EntityKind kind = 2;

  // Visibility layer. 0 is the shared layer, seen by everyone in the room; any
  // other value is a per-player or per-party layer. Players are always
  // shared-layer. See docs/architecture.md.
  uint32 layer = 3;

  sint32 x = 4;
  sint32 y = 5;
  sint32 vx = 6;
  sint32 vy = 7;
  sint32 w = 8;
  sint32 h = 9;

  uint32 flags = 10;  // bitfield of EntityFlag
  uint32 anim = 11;

  uint32 hp = 12;
  uint32 hp_max = 13;

  string name = 14;

  // State the player's own entity needs for prediction but other entities do
  // not. Only ever populated for self. Omitting any of it would make the
  // client's replay diverge from the server.
  uint32 coyote = 15;
  uint32 jump_buffer = 16;
  uint32 drop_through = 17;

  // Progression, only populated for self.
  uint32 level = 18;
  uint64 exp = 19;
  uint64 exp_to_next = 20;
  uint32 mp = 21;
  uint32 mp_max = 22;

  // Ground drops. A drop is an entity like any other so that visibility,
  // layering, and removal all work without a special case -- which is also
  // what makes cross-layer looting unrepresentable rather than merely
  // forbidden.
  string drop_item = 23;
  uint32 drop_qty = 24;
  uint32 drop_gold = 25;

  // Content id of a mob, so the client can pick its sprite without the server
  // sending a name string every time one spawns.
  string mob_id = 26;
}

// EntityDelta carries only what changed since the baseline tick.
message EntityDelta {
  uint32 id = 1;

  // Bitfield of EntityField marking which of the fields below are present.
  uint32 field_mask = 2;

  sint32 x = 3;
  sint32 y = 4;
  sint32 vx = 5;
  sint32 vy = 6;

  uint32 flags = 7;
  uint32 anim = 8;

  uint32 hp = 9;
  uint32 hp_max = 10;
}

message Snapshot {
  uint64 tick = 1;

  // Tick this delta is relative to. Zero means a full snapshot: either the
  // first one, or one sent because the client's baseline grew too stale to be
  // worth chasing.
  uint64 baseline_tick = 2;

  // Highest Intent.seq applied by the server. The client discards
  // acknowledged inputs and replays the rest on top of authoritative state.
  uint32 ack_seq = 3;

  repeated EntityDelta entities = 4;
  repeated EntityState entered = 5;  // newly visible, sent in full
  repeated uint32 removed = 6;       // died, or left the viewer's layer/range

  // The player's own entity, always complete and never delta-compressed. It is
  // one entity, it is what reconciliation is measured against, and a delta bug
  // here is far more expensive than the handful of bytes it would save.
  EntityState self = 7;
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------

// Event is a one-shot fact rather than state: never delta-compressed, and
// never inferred by the client from state changes. A client that derives "took
// damage" from a falling HP number cannot tell 200 damage from two hits of 100.
message Event {
  oneof body {
    PlayerJoined player_joined = 1;
    PlayerLeft player_left = 2;
    DamageDealt damage = 3;
    EntityDied died = 4;
    SkillCast skill_cast = 5;
    ExpGained exp_gained = 6;
    LevelUp level_up = 7;
    LootTaken loot_taken = 8;
    WaypointFound waypoint_found = 9;
    PortalRefused portal_refused = 10;
    WorldMap world_map = 12;
    ChatLine chat = 13;
    SystemMessage system = 14;
    PartyState party = 16;
    PartyInvite party_invite = 17;
    GuildState guild = 18;
    GuildInvite guild_invite = 19;
    FriendList friends = 20;
    BuffState buffs = 15;
    Healed healed = 21;
    Shielded shielded = 22;
    Absorbed absorbed = 23;
    SkillBar skill_bar = 24;
    PassiveState passives = 25;
    BossPhase boss_phase = 26;
    Downed downed = 27;
    DungeonState dungeon = 28;
  }
  // 11 was MapChanged, replaced by a second Welcome: it carried strictly less
  // than the Welcome the destination room already sends, and two messages
  // saying the same thing is one of them being wrong eventually.
  reserved 11;

}

// DamageDealt is sent rather than inferred from a falling HP number, because a
// client deriving "took damage" from state cannot tell 200 damage from two
// hits of 100 -- and the difference is the whole feel of a fight.
message DamageDealt {
  uint32 source_id = 1;
  uint32 target_id = 2;
  uint32 amount = 3;
  bool critical = 4;
  string element = 5;
}

message EntityDied {
  uint32 entity_id = 1;
  uint32 killer_id = 2;
}

// DungeonState is where a run stands: which stage, and whether it is over.
//
// Sent to the whole instance on every change rather than derived from what is
// alive. A client counting corpses cannot tell "the stage is clearing" from
// "the stage has not started", and the difference is whether the party should
// be pushing forward or holding.
message DungeonState {
  string dungeon_id = 1;
  string name = 2;

  // One-based, for display: "stage 2 of 2" rather than "stage 1 of 2".
  uint32 stage = 3;
  uint32 stages = 4;
  string stage_name = 5;

  // "active", "cleared", or "wiped".
  string state = 6;

  // How long before the party is sent home, once the run is over. Zero while
  // it is still running.
  uint32 ends_in_ms = 7;
}

// Downed is sent to a character who has just died, carrying the two things
// their own state does not tell them: how long until they are back, and what
// the death cost.
//
// There is deliberately no matching "revived" event. Coming back *is* state --
// full health, standing on the spawn point -- and the client already
// reconciles both exactly. A second message saying what the snapshot already
// says is the one that goes wrong eventually.
message Downed {
  uint32 entity_id = 1;

  // Milliseconds, not a tick number: a client counting down to a server tick
  // would need the server's tick, and a countdown is purely presentational.
  uint32 revive_in_ms = 2;

  // Experience lost, so the number that just moved is accounted for rather
  // than left looking like a bug.
  uint64 exp_lost = 3;
}

message SkillCast {
  uint32 caster_id = 1;
  string skill_id = 2;
  bool facing_left = 3;
}

// BossPhase announces an encounter changing what it is doing.
//
// Sent as an event rather than left for the client to infer from a health bar,
// because a phase change is the fight telling a party to do something
// different, and a party that misses it does not.
message BossPhase {
  uint32 entity_id = 1;
  string name = 2;

  // The phase's own name, or "enraged" when the phase's clock has run out.
  string phase = 3;

  uint32 hp = 4;
  uint32 hp_max = 5;
}

message ExpGained {
  uint64 amount = 1;
  uint64 total = 2;

  // Shared marks experience split with a party, so a player can tell a share
  // from a solo kill rather than concluding the numbers look wrong.
  bool shared = 3;
}

message LevelUp {
  uint32 level = 1;
  uint64 exp_to_next = 2;
}

// WaypointFound announces a fast-travel destination unlocked by visiting it.
//
// Unlocked by visiting rather than granted, so the world map fills in as a
// record of where someone has actually been.
message WaypointFound {
  string waypoint_id = 1;
  string name = 2;
  string map_id = 3;
}

// PortalRefused explains why a transition did not happen.
//
// A portal that silently does nothing reads as broken, and a level gate is
// only meaningful if the player is told about it.
message PortalRefused {
  string target_map = 1;
  uint32 required_level = 2;
  string reason = 3;
}

// OpenWorldMap asks for everything the map screen shows.
//
// Requested rather than pushed: the contents change only when a player unlocks
// a waypoint or a channel fills up, and neither is worth a per-tick broadcast
// to every client in the world.
message OpenWorldMap {}

// Travel is a request to move somewhere without walking: a fast-travel
// waypoint, or a different channel of the map the player is already in.
//
// Exactly one field is set. The server validates both -- an unlocked waypoint,
// an instance that exists and has room -- because a client that could name any
// destination could walk into a level-40 zone at level 3.
message Travel {
  oneof destination {
    string waypoint_id = 1;
    uint64 channel_instance_id = 2;

    // Ask for any channel but this one, creating it if every existing channel
    // is somewhere the player already is. This is what the button does: at
    // hobby scale there is usually only one channel, and "leave this instance"
    // is still a thing a player wants.
    bool new_channel = 3;
  }
}

// WorldMap is the map screen: where the player can go, and where they are.
message WorldMap {
  repeated MapSummary maps = 1;
  repeated WaypointSummary waypoints = 2;
  repeated ChannelSummary channels = 3;

  string current_map_id = 4;
  uint64 current_instance_id = 5;
}

message MapSummary {
  string map_id = 1;
  string name = 2;
  int32 min_level = 3;
  int32 max_level = 4;

  // Private maps are dungeons: a party gets its own copy, so they are shown
  // differently from a public zone with channels.
  bool private = 5;
}

// WaypointSummary is one fast-travel destination. Only unlocked waypoints are
// sent: the world map is a record of where a player has been, and listing the
// ones they have not found would give that away.
message WaypointSummary {
  string waypoint_id = 1;
  string name = 2;
  string map_id = 3;
}

// ChannelSummary is one instance of the map the player is currently in.
message ChannelSummary {
  uint64 instance_id = 1;

  // Channel is the position in the list, which is the number a player sees.
  // Instance IDs are never reused and grow forever, so they make a poor label.
  uint32 channel = 2;

  uint32 players = 3;
  uint32 capacity = 4;
  bool current = 5;
}

// Chat channels.
//
// They differ in who hears you, not in what you can say, so they are one
// message with a channel rather than five messages. Local is the only one that
// never leaves the room; everything else crosses nodes over the bus.
enum ChatChannel {
  CHAT_CHANNEL_UNSPECIFIED = 0;

  // Everyone in the room, whether or not they share a party. This is the
  // channel that makes a shared room feel shared.
  CHAT_CHANNEL_LOCAL = 1;

  // Everyone online, rate-limited hardest because it reaches the most people.
  CHAT_CHANNEL_GLOBAL = 2;

  // One named character.
  CHAT_CHANNEL_WHISPER = 3;

  CHAT_CHANNEL_PARTY = 4;
  CHAT_CHANNEL_GUILD = 5;
}

// ChatSend is a player saying something.
//
// The server decides who hears it. A client naming its own audience -- a list
// of recipients, a room id -- would be a client deciding what other players
// see, which is the one thing it never gets to do.
message ChatSend {
  ChatChannel channel = 1;
  string body = 2;

  // Target is the recipient's character name, for whispers only. Ignored on
  // every other channel.
  string target = 3;
}

// ChatLine is something said, delivered.
message ChatLine {
  ChatChannel channel = 1;

  // From is the speaker's display name, resolved by the server. A client
  // never gets to say who a message is from.
  string from = 2;
  string body = 3;

  // Whispered marks a whisper this player sent rather than received, so the
  // client can render "to Alice: hello" instead of "Alice: hello". Without it
  // the sender's own copy is indistinguishable from an incoming one.
  bool outgoing = 4;

  // ServerTimeMs is when the server accepted it, so a client can order lines
  // that arrived out of order and show timestamps that agree between players.
  int64 server_time_ms = 5;
}

// SystemMessage is the server talking to one player: a refusal, a notice, a
// result. Kept separate from ChatLine because it has no speaker, and dressing
// it up as one would mean inventing a name for the server.
message SystemMessage {
  string body = 1;

  // Channel the message is about, so the client can show it in the tab the
  // player was typing in rather than always in the system tab.
  ChatChannel channel = 2;
}

// PartyAction is a request to change party membership.
//
// Every one of these is checked against the party's actual state on the
// server: a client asking to kick somebody from a party it does not lead is
// asking, not doing.
message PartyAction {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_INVITE = 1;
    KIND_ACCEPT = 2;
    KIND_DECLINE = 3;
    KIND_LEAVE = 4;
    KIND_KICK = 5;
    KIND_PROMOTE = 6;
    KIND_SET_LOOT = 7;
  }

  Kind kind = 1;

  // A name rather than an ID because a name is what a player has: character
  // IDs are never shown, so a client could only supply one it had scraped from
  // a party it was already in.
  // Target is a character name, for invite, kick, and promote, and the loot
  // rule for KIND_SET_LOOT.
  string target = 2;
}

// PartyState is the whole party, sent whenever any of it changes.
//
// Whole rather than incremental: a party is at most six members, the delta
// would be most of the message anyway, and a client that misses one
// incremental update shows a roster that is quietly wrong until somebody
// leaves. An empty member list means "you are not in a party".
message PartyState {
  string party_id = 1;
  string leader_character_id = 2;
  repeated PartyMember members = 3;

  // Self is the recipient's own character ID, so a client can find itself in
  // the roster without matching on name.
  string self_character_id = 4;

  // Loot is how drops are assigned: "free-for-all" or "round-robin".
  string loot = 5;
}

// PartyMember is one member frame.
//
// Vitals are here rather than read from the snapshot because a party member in
// another room is not in the snapshot at all -- that is most of what a member
// frame is for.
message PartyMember {
  string character_id = 1;
  string name = 2;
  uint32 level = 3;
  uint32 hp = 4;
  uint32 hp_max = 5;

  // MapId is where they are, which is what tells a player whether their party
  // is together.
  string map_id = 6;

  // Online is false for a member inside their reconnect window: still in the
  // party, temporarily not in the world.
  bool online = 7;
}

message PartyInvite {
  string from_name = 1;

  // ExpiresInMs is how long the invitation stands, so the client can show a
  // prompt that goes away by itself rather than one that lingers after the
  // answer stopped mattering.
  int64 expires_in_ms = 2;
}

// GuildAction is a request to change a guild.
//
// Every one is checked against the requester's actual rank. A client asking to
// promote somebody in a guild it is not an officer of is asking, not doing.
message GuildAction {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_CREATE = 1;
    KIND_INVITE = 2;
    KIND_ACCEPT = 3;
    KIND_DECLINE = 4;
    KIND_LEAVE = 5;
    KIND_KICK = 6;
    KIND_PROMOTE = 7;
    KIND_DEMOTE = 8;
    KIND_SET_MOTD = 9;
  }

  Kind kind = 1;

  // Target is a guild name for create, a character name for invite, kick,
  // promote, and demote, and the message itself for set_motd.
  string target = 2;
}

// GuildState is the whole guild, sent whenever any of it changes.
//
// An empty guild_id means "you are not in a guild". The roster is sent whole
// for the same reason a party's is: a client that misses one incremental
// update holds a roster that is quietly wrong.
message GuildState {
  string guild_id = 1;
  string name = 2;
  string motd = 3;
  repeated GuildMember members = 4;

  // Rank is the recipient's own rank, so a client can grey out the buttons
  // they cannot use rather than offering them and being refused.
  uint32 rank = 5;
}

message GuildMember {
  string character_id = 1;
  string name = 2;
  uint32 rank = 3;
  uint32 level = 4;

  // Online is filled from presence, so a roster shows who is around now. A
  // guild roster is mostly people who are not.
  bool online = 5;
}

message GuildInvite {
  string guild_name = 1;
  string from_name = 2;
  int64 expires_in_ms = 3;
}

// SocialAction manages the friends list.
message SocialAction {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ADD_FRIEND = 1;
    KIND_REMOVE_FRIEND = 2;
    KIND_LIST_FRIENDS = 3;
  }

  Kind kind = 1;

  // Target is a character name.
  string target = 2;
}

// FriendList is the whole list, sent when it changes or is asked for.
//
// Requested rather than pushed on every change in presence: a client that
// wants live status can ask again, and broadcasting every login to everybody
// who has ever added that character is a fan-out nobody needs.
message FriendList {
  repeated FriendEntry friends = 1;
}

message FriendEntry {
  string character_id = 1;
  string name = 2;
  uint32 level = 3;

  bool online = 4;

  // MapId is where they are, so a friends list answers "can I go and find
  // them" rather than only "are they awake". Empty when offline.
  string map_id = 5;
}

// BuffState is everything currently on a character, sent whenever it changes.
//
// To the owner alone. A buff bar is the player's own business, and
// broadcasting every stack of every debuff on every mob in the room to
// everyone in it is a great deal of traffic for something nobody reads.
//
// Whole rather than incremental, for the same reason a party roster is: a
// client that misses one update shows a bar that is quietly wrong, and the
// whole thing is a handful of entries.
message BuffState {
  uint32 entity_id = 1;
  repeated BuffInstance buffs = 2;
}

message BuffInstance {
  string buff_id = 1;
  string name = 2;
  uint32 stacks = 3;

  // RemainingMs counts down client-side between updates, so a bar drains
  // smoothly rather than stepping once a second. Zero means it does not
  // expire on its own, which is what an aura is.
  uint32 remaining_ms = 4;

  // Harmful decides which end of the bar it goes on and what colour it is.
  // A player needs to tell "I am on fire" from "I am strong" without reading.
  bool harmful = 5;
}

// Healed is sent rather than left for the client to infer from a rising
// health bar, for the same reason DamageDealt is: a bar cannot distinguish one
// large heal from two small ones, and the difference is most of what a healer
// is reading.
message Healed {
  uint32 entity_id = 1;
  uint32 amount = 2;
}

// Shielded announces an absorption pool, which is not visible in the health
// bar because it sits in front of it.
message Shielded {
  uint32 entity_id = 1;
  uint32 amount = 2;
}

// Absorbed reports damage a shield soaked. Without it a hit that vanished
// into a pool the player cannot see reads as the attack having missed.
message Absorbed {
  uint32 entity_id = 1;
  uint32 amount = 2;
  uint32 remaining = 3;
}

// SetSkillSlot rearranges the skill bar.
//
// Every rule about what may go where is checked server-side. A client that
// could put any skill in any slot with any support attached could cast a mob
// ability with every support in the game linked to it.
message SetSkillSlot {
  uint32 slot = 1;

  // Empty clears the slot.
  string skill_id = 2;

  // Supports to link, in the order they apply. Order matters: two that both
  // scale damage compose differently depending on which repeats first.
  repeated string supports = 3;
}

// SkillBar is the whole loadout: what is on the bar, what the character knows,
// and what supports exist to link.
message SkillBar {
  repeated SkillSlot slots = 1;
  repeated KnownSkill known = 2;
  repeated SupportInfo supports = 3;
}

message SkillSlot {
  string skill_id = 1;
  string name = 2;
  uint32 rank = 3;
  uint32 cooldown_ms = 4;

  // The cost after supports, because that is what will actually be charged --
  // a bar showing the base cost is a bar that lies.
  uint32 cost_mp = 5;

  repeated string supports = 6;
}

message KnownSkill {
  string skill_id = 1;
  string name = 2;
  uint32 rank = 3;
  uint32 max_rank = 4;

  // Tags decide which supports fit, so the client can grey out the ones that
  // do not rather than offering them and being refused.
  repeated string tags = 5;
}

message SupportInfo {
  string support_id = 1;
  string name = 2;
  repeated string tags = 3;
}

// PassiveAction changes the passive tree.
//
// Every rule is checked server-side. A client that could allocate anything
// could take every keystone in the game.
message PassiveAction {
  // Exactly one. Allocating and refunding in the same message would need an
  // order between them, and the order would decide whether it was legal.
  oneof action {
    uint32 allocate = 1;
    uint32 refund = 2;
    bool respec_all = 3;
  }
}

// PassiveState is what a character holds and what they can afford.
//
// The tree itself is not here: it is content, identical for everybody, and the
// client already refuses to connect on a content hash mismatch. Sending
// several hundred nodes on every allocation would be sending the same thing
// over and over.
message PassiveState {
  repeated uint32 allocated = 1;

  // StartNode is allocated for free and cannot be refunded, so the client
  // shows it differently rather than offering a refund that will be refused.
  uint32 start_node = 2;

  uint32 spent_points = 3;
  uint32 total_points = 4;
}

message LootTaken {
  uint32 entity_id = 1;
  string item_id = 2;
  uint32 qty = 3;
  uint32 gold = 4;

  // A claim that could not be completed -- a full inventory, or a database
  // error. The drop is returned to the ground rather than destroyed, so the
  // player can try again; saying why is what stops that reading as the game
  // ignoring the keypress.
  bool failed = 5;
  string reason = 6;
}

// Inventory is the player's items, sent in full whenever they change.
//
// Not delta-compressed: inventories change rarely compared to positions, they
// are small, and a delta bug here means an item that appears to exist twice --
// which is the one class of bug this system is built to make impossible.
message Inventory {
  repeated ItemStack carried = 1;
  repeated ItemStack equipped = 2;
  uint32 capacity = 3;
  uint64 gold = 4;

  // The character's derived statistics, so a tooltip can show what equipping
  // something would change without the client reimplementing the stat
  // pipeline.
  repeated StatValue stats = 5;
}

message ItemStack {
  string item_id = 1;   // the instance's durable identity
  string base_id = 2;
  string name = 3;      // generated: "Heavy Iron Sword of Force"
  string rarity = 4;
  uint32 slot = 5;
  uint32 stack = 6;
  uint32 item_level = 7;

  // The slot this is worn in, for equipped items.
  string equip_slot = 8;

  // Level required to equip it.
  uint32 required_level = 9;

  repeated ItemMod mods = 10;
}

// ItemMod is one rolled modifier, carrying enough to render a tooltip line
// without the client holding a copy of the affix tables.
message ItemMod {
  string stat = 1;
  string kind = 2;

  // The rolled value, in stat millionths, so the client shows exactly the
  // number the server computed with.
  sint64 value = 3;

  // Tier and whether it is implicit, so a tooltip can show how good a roll is
  // rather than only what it does.
  uint32 tier = 4;
  bool implicit = 5;
}

message StatValue {
  string stat = 1;
  sint64 value = 2;
}

message PlayerJoined {
  uint32 entity_id = 1;
  string name = 2;
}

message PlayerLeft {
  uint32 entity_id = 1;
}
