# Hobby-scale deployment: the whole game on one box.
#
# Every host port is overridable, because the standard ones are often already
# taken on a developer machine:
#
#   POSTGRES_PORT=5433 REDIS_PORT=6380 NATS_PORT=4223 docker compose -f deploy/docker-compose.yml up
#
# The container-side ports stay standard, so nothing inside the compose network
# has to know about the override.
#
# Postgres and Redis are here from the start even though M0 uses neither, so
# that persistence in M2 is a configuration change rather than an
# infrastructure project. Scaling out to many nodes replaces this file with
# Kubernetes manifests in M9; nothing in the game code changes.

name: mmo

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mmo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: mmo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images store data in a major-version-specific subdirectory
      # and expect the mount one level up, at /var/lib/postgresql. Mounting the
      # older /var/lib/postgresql/data path makes the container refuse to start
      # outright rather than fall back.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmo -d mmo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Presence, sessions, leases, and the room directory all live here, and
    # every one of them is reconstructible. Losing Redis costs players a
    # disconnect, not data, so persistence is deliberately off.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    # No persistence and no JetStream. Every subject on this bus is either
    # best-effort -- a chat line, a presence update -- or retried by its caller,
    # so a message that does not survive a restart costs nothing. Turning on
    # persistence would add an operational burden for a guarantee nothing asks
    # for.
    command: ["--http_port", "8222"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      # The monitoring endpoint, for looking at subscription counts and slow
      # consumers when a node misbehaves.
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      - "--roles=all"
      - "--addr=:8080"
      - "--admin-addr=0.0.0.0:9090"
      # Development authentication has no identity check at all. It is on here
      # because M2 has not built OIDC yet, and this compose file is meant for a
      # laptop. Remove it before this is reachable by anyone else.
      - "--dev-auth"
      - "--client-dir=/srv/client"
    environment:
      DATABASE_URL: postgres://mmo:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/mmo?sslmode=disable
      REDIS_URL: redis://redis:6379
      # Left unset on purpose. One server process needs no network bus, and the
      # in-process one is the correct implementation for it rather than a
      # placeholder. Set NATS_URL=nats://nats:4222 when running more than one.
      # NATS_URL: nats://nats:4222
    ports:
      - "${GAME_PORT:-8080}:8080"
      - "127.0.0.1:${ADMIN_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
