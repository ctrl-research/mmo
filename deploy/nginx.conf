# Serves the built client only. /api, /ws and /healthz never reach nginx --
# the gateway routes those to the server on the same hostname, which is what
# keeps the browser on a single origin and leaves the server's same-origin
# WebSocket check intact.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # NOT a `types { ... }` block: that REPLACES the inherited mime.types map
    # rather than extending it, which silently drops index.html to
    # application/octet-stream and every other type with it. default_type only
    # fills in when the map has no entry, so this is additive either way.
    #
    # It matters because a WASM served as the wrong type fails
    # instantiateStreaming, and that surfaces as prediction never starting
    # rather than as an error anyone would connect back to nginx.
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        # One header, not `expires` plus `add_header` -- those emit two
        # Cache-Control lines.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must not be cached, or a deploy leaves browsers loading the
    # previous bundle's asset URLs, which 404 against the new image.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: any unmatched path renders the app rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Kubelet probes hit this; it must not be the SPA fallback, or a broken
    # bundle would still report healthy.
    location = /nginx-healthz {
        access_log off;
        return 200 "ok\n";
    }
}
