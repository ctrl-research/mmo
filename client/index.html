<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>MMO</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #0b0d12; }
      body {
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #e6e8ee;
      }
      #stage { position: fixed; inset: 0; }
      #hud {
        position: fixed; top: 10px; left: 10px; z-index: 10;
        background: rgba(11, 13, 18, 0.82); border: 1px solid #262b36;
        border-radius: 6px; padding: 8px 10px; pointer-events: none;
        white-space: pre; font-size: 12px; line-height: 1.6; color: #9aa3b2;
      }
      #hud b { color: #e6e8ee; font-weight: 600; }
      #overlay {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
        background: rgba(11, 13, 18, 0.94); overflow-y: auto; padding: 24px;
      }
      #overlay[hidden] { display: none; }

      .panel {
        border: 1px solid #262b36; border-radius: 8px; padding: 24px;
        background: #12151c; width: min(360px, 100%); text-align: center;
      }
      .panel h1 { font-size: 15px; margin-bottom: 4px; letter-spacing: 0.04em; }
      .panel p { color: #9aa3b2; margin-bottom: 16px; font-size: 12px; }

      .panel input {
        width: 100%; padding: 8px 10px; margin-bottom: 8px; font: inherit;
        background: #0b0d12; color: #e6e8ee;
        border: 1px solid #2f3543; border-radius: 5px;
      }
      .panel input:focus { outline: none; border-color: #4a83ff; }

      .btn {
        display: block; width: 100%; padding: 8px; margin-bottom: 8px;
        font: inherit; font-weight: 600; text-decoration: none;
        background: #4a83ff; color: #0b0d12; border: 0; border-radius: 5px;
        cursor: pointer; text-align: center;
      }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .btn.ghost { background: transparent; color: #9aa3b2; border: 1px solid #2f3543; }
      .btn.small { width: auto; padding: 6px 12px; margin: 0; font-size: 12px; }

      .divider { color: #4a5262; font-size: 11px; margin: 12px 0 8px; }

      /* Class picker: cards rather than a dropdown, because the choice is
         permanent for that character and a one-line description is the whole
         basis for making it. */
      .classes { display: flex; gap: 6px; margin-bottom: 8px; }
      .class-option {
        flex: 1; padding: 8px 6px; font: inherit; text-align: left;
        background: #0f1218; color: #9aa3b2;
        border: 1px solid #2f3543; border-radius: 5px; cursor: pointer;
      }
      .class-option:hover { border-color: #4a83ff; }
      .class-option.chosen { border-color: #4a83ff; color: #e6e8ee; }
      .class-name { display: block; font-size: 12px; font-weight: 600; }
      .class-desc { display: block; font-size: 10px; color: #6b7280; margin-top: 2px; }

      .chars { list-style: none; margin-bottom: 14px; text-align: left; }
      .char {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 10px; margin-bottom: 6px;
        border: 1px solid #262b36; border-radius: 6px; background: #0f1218;
      }
      .char-main { flex: 1; min-width: 0; }
      .char-name { font-weight: 600; font-size: 13px; }
      .char-sub { color: #6b7280; font-size: 11px; }

      .notice { margin-top: 10px; font-size: 12px; min-height: 1.4em; color: #9aa3b2; }
      .notice.error { color: #ff6b6b; }
      .notice.empty { min-height: 0; }

      .hint { color: #6b7280; font-size: 11px; margin-top: 10px; }
      .error { color: #ff6b6b; font-size: 12px; }

      /* Inventory */
      #inventory {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 15; width: min(760px, 94vw); max-height: 88vh; overflow-y: auto;
        background: #12151c; border: 1px solid #2f3543; border-radius: 8px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      #inventory[hidden] { display: none; }

      .inv-header {
        display: flex; justify-content: space-between; align-items: baseline;
        padding: 12px 16px; border-bottom: 1px solid #262b36; font-weight: 600;
      }
      .inv-hint { color: #6b7280; font-size: 11px; font-weight: 400; }

      .inv-body {
        display: grid; grid-template-columns: 170px 1fr 170px; gap: 14px; padding: 14px;
      }

      .inv-equipment { display: flex; flex-direction: column; gap: 6px; }
      .equip-slot {
        border: 1px solid #2f3543; border-radius: 5px; padding: 6px 8px;
        min-height: 44px; cursor: pointer; background: #0f1218;
      }
      .equip-slot.empty { opacity: 0.45; cursor: default; }
      .equip-slot:not(.empty):hover { border-color: #4a83ff; }
      .slot-label { display: block; color: #6b7280; font-size: 10px; text-transform: uppercase; }
      .item-name { display: block; font-size: 11px; margin-top: 2px; }

      .inv-grid {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; align-content: start;
      }
      .inv-cell {
        position: relative; border: 1px solid #262b36; border-radius: 4px;
        min-height: 46px; padding: 5px; font-size: 10px; cursor: pointer;
        background: #0f1218; overflow: hidden;
      }
      .inv-cell.empty { cursor: default; opacity: 0.35; }
      .inv-cell:not(.empty):hover { border-color: #4a83ff; }
      .cell-stack {
        position: absolute; right: 3px; bottom: 2px; color: #9aa3b2; font-size: 10px;
      }

      .inv-stats { display: flex; flex-direction: column; gap: 3px; font-size: 11px; }
      .stat-row { display: flex; justify-content: space-between; color: #9aa3b2; }
      .stat-row b { color: #e6e8ee; }

      /* Rarity is the fastest read on an item, so it is colour before text. */
      .rarity-normal { color: #d7dce6; }
      .rarity-magic  { color: #6fa8ff; }
      .rarity-rare   { color: #e0c04a; }
      .rarity-unique { color: #d08a3f; }

      /* Chat */
      #chat {
        position: fixed; left: 10px; bottom: 10px; z-index: 12;
        width: min(420px, 46vw); display: flex; flex-direction: column; gap: 4px;
      }
      #chat[hidden] { display: none; }

      .chat-log {
        max-height: 26vh; overflow-y: auto; padding: 6px 8px;
        background: rgba(11, 13, 18, 0.72); border: 1px solid #262b36;
        border-radius: 6px; font-size: 11px; line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .chat-line { margin-bottom: 1px; }
      .chat-who { font-weight: 600; }

      /* Colour is the channel. Tabs would hide the message you were not
         looking at, which is the one chat is for. */
      .chat-local   { color: #d7dce6; }
      .chat-global  { color: #9fd0ff; }
      .chat-whisper { color: #d9a8ff; }
      .chat-party   { color: #8fe3a8; }
      .chat-guild   { color: #e8c977; }
      .chat-system  { color: #7c8798; font-style: italic; }

      .chat-input {
        padding: 6px 8px; font: inherit; font-size: 12px;
        background: rgba(11, 13, 18, 0.9); color: #e6e8ee;
        border: 1px solid #2f3543; border-radius: 5px;
      }
      .chat-input:focus { outline: none; border-color: #4a83ff; }

      /* Party frames */
      #party {
        position: fixed; top: 10px; right: 10px; z-index: 12;
        width: 190px; padding: 8px;
        background: rgba(11, 13, 18, 0.82); border: 1px solid #262b36;
        border-radius: 6px; font-size: 11px;
      }
      #party[hidden] { display: none; }

      .party-header {
        display: flex; justify-content: space-between; align-items: baseline;
        margin-bottom: 6px; font-weight: 600;
      }
      .party-loot { color: #6b7280; font-size: 10px; font-weight: 400; }

      .party-member { margin-bottom: 6px; }
      .party-member.offline { opacity: 0.45; }
      .party-name { display: flex; align-items: baseline; gap: 4px; }
      .party-where { color: #6b7280; font-size: 10px; margin-left: auto; }
      .party-kick {
        background: none; border: 0; color: #6b7280; cursor: pointer;
        font: inherit; padding: 0 2px;
      }
      .party-kick:hover { color: #ff6b6b; }

      .party-bar {
        height: 5px; margin-top: 2px; border-radius: 3px; background: #2a1f24;
        overflow: hidden;
      }
      .party-bar-fill { height: 100%; background: #5fbf6a; }

      .party-actions { display: flex; gap: 4px; margin-top: 6px; }
      .party-actions button {
        flex: 1; font: inherit; font-size: 10px; padding: 3px;
        background: #0f1218; color: #9aa3b2;
        border: 1px solid #2f3543; border-radius: 4px; cursor: pointer;
      }
      .party-actions button:hover { border-color: #4a83ff; color: #e6e8ee; }

      /* Social panel */
      #social {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 15; width: min(620px, 94vw); max-height: 88vh; overflow-y: auto;
        background: #12151c; border: 1px solid #2f3543; border-radius: 8px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      #social[hidden] { display: none; }

      .social-header {
        display: flex; justify-content: space-between; align-items: baseline;
        padding: 12px 16px; border-bottom: 1px solid #262b36; font-weight: 600;
      }
      .social-hint { color: #6b7280; font-size: 11px; font-weight: 400; }

      .social-body {
        display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px;
      }
      .social-body h2 {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
        color: #6b7280; margin-bottom: 6px; font-weight: 600;
      }
      .social-empty { color: #4a5262; font-size: 11px; margin-bottom: 8px; }
      .guild-motd {
        color: #e8c977; font-size: 11px; margin-bottom: 8px;
        padding: 6px 8px; background: #0f1218; border-radius: 4px;
      }

      .social-list { margin-bottom: 8px; }
      .social-row {
        display: flex; align-items: baseline; gap: 6px;
        padding: 4px 6px; border-radius: 4px; font-size: 11px;
      }
      .social-row:hover { background: #0f1218; }
      .social-row.offline { opacity: 0.45; }
      .social-name { font-weight: 600; }
      .social-sub { color: #6b7280; font-size: 10px; margin-left: auto; }
      .social-mini {
        background: none; border: 0; color: #6b7280; cursor: pointer;
        font: inherit; font-size: 10px; padding: 0 2px;
      }
      .social-mini:hover { color: #e6e8ee; }

      .social-action {
        display: block; width: 100%; margin-bottom: 4px; padding: 5px;
        font: inherit; font-size: 11px;
        background: #0f1218; color: #9aa3b2;
        border: 1px solid #2f3543; border-radius: 4px; cursor: pointer;
      }
      .social-action:hover { border-color: #4a83ff; color: #e6e8ee; }

      /* Skill bar and buff bar: permanently on screen, because both answer
         questions that only matter in the moment. */
      /* Settings. Small and centred: there is one thing in it today, and a
         full-screen panel for one slider would be a lie about how much is
         configurable. */
      #settings {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 16; width: min(340px, 92vw);
        background: #12151c; border: 1px solid #2f3543; border-radius: 8px;
        padding: 14px 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      #settings[hidden] { display: none; }

      .settings-header {
        display: flex; justify-content: space-between; align-items: baseline;
        font-weight: 600; font-size: 13px; margin-bottom: 12px;
      }
      .settings-hint { color: #6b7280; font-size: 11px; font-weight: 400; }

      .settings-row {
        display: flex; align-items: center; gap: 10px; font-size: 12px;
      }
      .settings-label { color: #9aa3b2; min-width: 92px; }
      .settings-slider { flex: 1; accent-color: #4a83ff; }
      .settings-autoloot { flex: 1; accent-color: #4a83ff; justify-self: start; }
      .settings-value { color: #e6e8ee; min-width: 44px; text-align: right; }
      .settings-note { color: #6b7280; font-size: 11px; margin: 4px 0 10px; }

      /* Vitals: health, mana, experience. Directly above the skill bar,
         because the two are read together -- what you can cast and whether
         you can afford it. */
      #vitals {
        position: fixed; bottom: 68px; left: 50%; transform: translateX(-50%);
        z-index: 12; display: flex; align-items: center; gap: 8px;
        pointer-events: none;
        background: rgba(11, 13, 18, 0.86); border: 1px solid #2f3543;
        border-radius: 6px; padding: 6px 10px;
      }
      #vitals[hidden] { display: none; }

      .vitals-level {
        font-size: 12px; font-weight: 700; color: #e6e8ee;
        letter-spacing: 0.04em; min-width: 44px;
      }
      .vitals-bars { display: flex; flex-direction: column; gap: 3px; }

      .vital {
        position: relative; width: 240px; height: 13px;
        background: #0b0d12; border-radius: 3px; overflow: hidden;
      }
      /* Experience is progress rather than a resource, so it is thinner: it
         should be readable without competing with the two bars that decide
         whether you live. Not so thin that its own label does not fit. */
      .vital.exp { height: 11px; }

      .vital-fill { height: 100%; width: 0; transition: width 120ms linear; }
      .hp .vital-fill { background: linear-gradient(90deg, #b33c3c, #e05a5a); }
      .mp .vital-fill { background: linear-gradient(90deg, #2f5fa8, #4a83ff); }
      .exp .vital-fill { background: linear-gradient(90deg, #7a6a1f, #e0b44a); }

      .vital-text {
        position: absolute; inset: 0; display: grid; place-items: center;
        font-size: 9px; color: #e6e8ee; text-shadow: 0 1px 2px #000;
      }
      .vital.exp .vital-text { font-size: 8px; }

      #skillbar {
        position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
        z-index: 12; display: flex; gap: 4px;
      }
      #skillbar[hidden] { display: none; }

      .slot {
        position: relative; width: 54px; height: 50px; overflow: hidden;
        background: rgba(11, 13, 18, 0.86); border: 1px solid #2f3543;
        border-radius: 5px; padding: 3px 4px; font-size: 10px;
      }
      .slot-key { color: #6b7280; font-size: 9px; }
      .slot-name {
        display: block; color: #e6e8ee; font-size: 10px; line-height: 1.2;
        margin-top: 1px; overflow: hidden;
      }
      .slot-cost { position: absolute; right: 4px; bottom: 2px; color: #6fa8ff; }
      .slot-links {
        position: absolute; right: 4px; top: 2px; color: #e8c977; font-size: 9px;
      }
      /* Grows from the bottom as the cooldown runs down, which is the
         direction every game of this shape uses. */
      .slot-sweep {
        position: absolute; left: 0; bottom: 0; width: 100%; height: 0;
        background: rgba(11, 13, 18, 0.72); pointer-events: none;
        transition: height 60ms linear;
      }

      #buffbar {
        position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
        z-index: 12; display: flex; gap: 4px;
      }
      #buffbar[hidden] { display: none; }

      .buff {
        display: flex; align-items: baseline; gap: 4px;
        padding: 3px 7px; font-size: 10px;
        background: rgba(11, 13, 18, 0.86); border: 1px solid #3d6b4a;
        border-radius: 4px; color: #8fe3a8;
      }
      .buff.harmful { border-color: #6b3d3d; color: #ff9a9a; }
      .buff-name { font-weight: 600; }
      .buff-stacks { color: #e8c977; }
      .buff-time { color: #6b7280; }

      /* The dungeon frame: which stage, and whether the run is still
         winnable.
         Bottom-right rather than top-right, which is the party panel's corner
         -- and a party is exactly who is in a dungeon, so the two would have
         collided every time either mattered. */
      #dungeon {
        position: fixed; bottom: 74px; right: 10px; z-index: 12;
        width: 190px; pointer-events: none;
        background: rgba(11, 13, 18, 0.86); border: 1px solid #2f3543;
        border-radius: 6px; padding: 6px 9px 7px;
      }
      #dungeon[hidden] { display: none; }
      #dungeon.cleared { border-color: #3d6b4a; }
      #dungeon.wiped { border-color: #6b3d3d; }

      .dungeon-name {
        font-size: 11px; font-weight: 600; color: #d7dce6;
        letter-spacing: 0.04em; margin-bottom: 2px;
      }
      .dungeon-stage { font-size: 10px; color: #6b7280; }
      /* A stage change is lit while it is news, then settles back. */
      .dungeon-stage.fresh { color: #ffd280; }
      #dungeon.cleared .dungeon-stage { color: #8fe3a8; }
      #dungeon.wiped .dungeon-stage { color: #ff9a9a; }
      .dungeon-note { font-size: 10px; color: #9aa3b2; margin-top: 3px; }
      .dungeon-note[hidden] { display: none; }

      /* The death screen. Centred and unmissable: a character who stops
         responding with no explanation reads as the game having frozen. */
      /* Below the panels rather than above them. It covers the whole screen,
         so anything opened on top of it has to win or it cannot be read --
         and being dead is not a reason to be unable to change a setting. */
      #death {
        position: fixed; inset: 0; z-index: 14;
        display: grid; place-items: center; align-content: center; gap: 6px;
        background: rgba(11, 13, 18, 0.72); pointer-events: none;
        text-align: center;
      }
      #death[hidden] { display: none; }
      .death-title {
        font-size: 22px; font-weight: 700; letter-spacing: 0.08em;
        color: #ff6b6b; text-shadow: 0 2px 8px #000;
      }
      .death-countdown { font-size: 13px; color: #d7dce6; }
      .death-cost { font-size: 12px; color: #9aa3b2; }
      .death-cost[hidden] { display: none; }

      /* The boss frame. Top-centre and wide, because it is the one thing on
         screen that has to be readable without looking away from the fight. */
      #boss {
        position: fixed; top: 42px; left: 50%; transform: translateX(-50%);
        z-index: 12; width: min(460px, 76vw); pointer-events: none;
        background: rgba(11, 13, 18, 0.86); border: 1px solid #5a2f36;
        border-radius: 6px; padding: 6px 9px 7px;
      }
      #boss[hidden] { display: none; }
      #boss.enraged { border-color: #ff4d4d; }

      .boss-head {
        display: flex; align-items: baseline; gap: 8px;
        font-size: 11px; margin-bottom: 4px;
      }
      .boss-name { font-weight: 600; color: #ffb3b3; letter-spacing: 0.04em; }
      .boss-phase { margin-left: auto; color: #6b7280; font-size: 10px; }
      /* A phase change is lit while it is news, then settles back. */
      .boss-phase.fresh { color: #ffd280; }
      #boss.enraged .boss-phase.fresh { color: #ff6b6b; }

      .boss-bar {
        position: relative; height: 14px; border-radius: 3px;
        background: #1a1015; overflow: hidden;
      }
      .boss-fill {
        height: 100%; width: 100%;
        background: linear-gradient(90deg, #b33c3c, #e05a5a);
        transition: width 140ms linear;
      }
      #boss.enraged .boss-fill {
        background: linear-gradient(90deg, #d13030, #ff7a4d);
      }
      .boss-text {
        position: absolute; inset: 0; display: grid; place-items: center;
        font-size: 10px; color: #ffe3e3; text-shadow: 0 1px 2px #000;
      }

      /* Passive tree: a canvas, because several hundred nodes that pan and
         zoom in DOM is hundreds of layout boxes recalculated on every drag. */
      /* Crafting panel. Opened by standing at a station, so it names the
         station rather than a skill: what you can make depends on where you
         are standing, which is the whole point of a station. */
      #crafting {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 15; width: min(520px, 94vw); max-height: 88vh; overflow-y: auto;
        background: #12151c; border: 1px solid #2f3543; border-radius: 8px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      #crafting[hidden] { display: none; }

      .craft-header {
        display: flex; justify-content: space-between; align-items: baseline;
        padding: 12px 16px; border-bottom: 1px solid #262b36; font-weight: 600;
      }
      .craft-hint { color: #6b7280; font-size: 11px; font-weight: 400; }
      .craft-body { padding: 8px 10px; }
      .craft-empty { color: #4a5262; font-size: 11px; padding: 8px; }

      .craft-row {
        display: flex; justify-content: space-between; align-items: flex-start;
        gap: 12px; width: 100%; text-align: left;
        padding: 8px; margin-bottom: 4px;
        font: inherit; color: #e6e8ee;
        background: #0f1218; border: 1px solid #2f3543; border-radius: 4px;
        cursor: pointer;
      }
      .craft-row:hover:not(:disabled) { border-color: #4a83ff; }
      .craft-row:disabled { cursor: default; opacity: 0.5; }
      .craft-row.running { border-color: #b08968; background: #191510; }

      .craft-name { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
      .craft-inputs { font-size: 10px; color: #9aa3b2; }
      .craft-blocked { font-size: 10px; color: #d8a24a; margin-top: 3px; }

      .craft-meta { text-align: right; white-space: nowrap; }
      .craft-level { font-size: 10px; color: #6b7280; }
      .craft-exp { font-size: 10px; color: #7fb069; }

      .craft-status {
        padding: 8px 16px; border-top: 1px solid #262b36;
        font-size: 11px; color: #6b7280; min-height: 17px;
      }
      .craft-status.making { color: #ffb35c; }
      .craft-status.stopped { color: #d8a24a; }

      /* Skills panel. Secondary skills are the one part of progression with no
         presence in the world -- a main level is on the character frame and
         gear is on the body -- so this is where "my woodcutting is 34" lives. */
      #skills {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 15; width: min(460px, 94vw); max-height: 88vh; overflow-y: auto;
        background: #12151c; border: 1px solid #2f3543; border-radius: 8px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      #skills[hidden] { display: none; }

      .skills-header {
        display: flex; justify-content: space-between; align-items: baseline;
        padding: 12px 16px; border-bottom: 1px solid #262b36; font-weight: 600;
      }
      .skills-hint { color: #6b7280; font-size: 11px; font-weight: 400; }
      .skills-body { padding: 8px 10px; }

      .skills-row {
        display: grid; grid-template-columns: 30px 1fr auto;
        align-items: center; gap: 10px;
        padding: 7px 8px; border-radius: 4px;
      }
      .skills-row:hover { background: #0f1218; }
      .skills-row.levelled { background: #16211a; }

      .skills-level {
        font-size: 17px; font-weight: 700; text-align: center; color: #cfe8b4;
      }
      .skills-row.levelled .skills-level { color: #8fe3a8; }
      .skills-name { font-size: 12px; font-weight: 600; margin-bottom: 3px; }

      .skills-bar {
        height: 5px; background: #0b0d12; border-radius: 3px; overflow: hidden;
      }
      .skills-fill { height: 100%; background: #7fb069; width: 0%; }
      .skills-detail { font-size: 10px; color: #6b7280; margin-top: 3px; }

      .skills-tool { font-size: 10px; text-align: right; white-space: nowrap; }
      .skills-tool.held { color: #7fb069; }
      .skills-tool.bare { color: #6b7280; }
      .skills-tool.missing { color: #d8a24a; }

      /* The gathering line. Above the vitals bar rather than beside it: it is a
         thing the character is doing right now, and that is the corner where
         the rest of those live. The offset clears the vitals bar's own height
         -- 96px put it straight through the health bar, which is exactly the
         kind of thing only looking at it finds. */
      #gathering {
        position: fixed; left: 50%; transform: translateX(-50%); bottom: 126px;
        z-index: 12; padding: 4px 12px; font-size: 11px;
        background: rgba(10, 13, 18, 0.82); border: 1px solid #2f3543;
        border-radius: 12px; color: #cfe8b4; pointer-events: none;
      }
      #gathering[hidden] { display: none; }
      #gathering.refused { color: #d8a24a; border-color: #4a3f26; }

      #passives {
        position: fixed; inset: 24px; z-index: 16;
        background: #0b0d12; border: 1px solid #2f3543; border-radius: 8px;
        display: flex; flex-direction: column; overflow: hidden;
      }
      #passives[hidden] { display: none; }

      .tree-header {
        display: flex; align-items: baseline; gap: 12px;
        padding: 10px 14px; border-bottom: 1px solid #262b36;
        font-weight: 600; font-size: 12px;
      }
      .tree-points { color: #e0c04a; font-weight: 400; }
      .tree-hint { margin-left: auto; color: #6b7280; font-size: 11px; font-weight: 400; }
      .tree-respec {
        font: inherit; font-size: 11px; font-weight: 400; padding: 3px 8px;
        background: #12151c; color: #9aa3b2;
        border: 1px solid #2f3543; border-radius: 4px; cursor: pointer;
      }
      .tree-respec:hover { border-color: #d05353; color: #ff9a9a; }

      .tree-canvas { flex: 1; width: 100%; cursor: grab; touch-action: none; }
      .tree-canvas:active { cursor: grabbing; }

      .tree-tooltip {
        position: absolute; pointer-events: none; z-index: 2;
        max-width: 260px; padding: 8px 10px;
        background: #12151c; border: 1px solid #2f3543; border-radius: 6px;
        font-size: 11px; line-height: 1.5;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      }
      .tree-tooltip[hidden] { display: none; }
      .tip-name { font-weight: 700; margin-bottom: 3px; }
      .tip-mod { color: #6fa8ff; }
      .tip-status { color: #6b7280; font-size: 10px; margin-top: 4px; }

      /* Prompts: in-game, because a native modal blocks the render loop. */
      #prompt {
        position: fixed; top: 34%; left: 50%; transform: translate(-50%, -50%);
        z-index: 25; width: min(340px, 90vw); padding: 16px;
        background: #12151c; border: 1px solid #2f3543; border-radius: 8px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      }
      #prompt[hidden] { display: none; }
      .prompt-question { font-size: 12px; margin-bottom: 10px; }
      .prompt-input {
        width: 100%; padding: 7px 9px; margin-bottom: 10px; font: inherit;
        font-size: 12px; background: #0b0d12; color: #e6e8ee;
        border: 1px solid #2f3543; border-radius: 5px;
      }
      .prompt-input:focus { outline: none; border-color: #4a83ff; }
      .prompt-actions { display: flex; gap: 6px; }
      .prompt-actions button {
        flex: 1; padding: 6px; font: inherit; font-size: 12px; font-weight: 600;
        border-radius: 5px; cursor: pointer;
        background: #4a83ff; color: #0b0d12; border: 0;
      }
      .prompt-actions .prompt-cancel {
        background: transparent; color: #9aa3b2; border: 1px solid #2f3543;
        font-weight: 400;
      }

      /* World map */
      #worldmap {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 15; width: min(720px, 94vw); max-height: 88vh; overflow-y: auto;
        background: #12151c; border: 1px solid #2f3543; border-radius: 8px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      #worldmap[hidden] { display: none; }

      .map-header {
        display: flex; justify-content: space-between; align-items: baseline;
        padding: 12px 16px; border-bottom: 1px solid #262b36; font-weight: 600;
      }
      .map-hint { color: #6b7280; font-size: 11px; font-weight: 400; }

      .map-body {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 14px;
      }
      .map-body h2 {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
        color: #6b7280; margin-bottom: 6px; font-weight: 600;
      }
      .map-empty { color: #4a5262; font-size: 11px; }

      .map-row {
        display: block; width: 100%; text-align: left; font: inherit;
        border: 1px solid #262b36; border-radius: 5px; background: #0f1218;
        padding: 6px 8px; margin-bottom: 5px; color: #e6e8ee;
      }
      .map-row.action { cursor: pointer; }
      .map-row.action:hover:not(:disabled) { border-color: #4a83ff; }
      .map-row.current { border-color: #2f3543; opacity: 0.7; cursor: default; }
      .map-name { display: block; font-size: 12px; }
      .map-sub { display: block; color: #6b7280; font-size: 10px; }

      #tooltip {
        position: fixed; z-index: 30; pointer-events: none;
        max-width: 300px; padding: 10px 12px;
        background: #0b0d12; border: 1px solid #2f3543; border-radius: 6px;
        font-size: 11px; line-height: 1.5;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      }
      #tooltip[hidden] { display: none; }
      .tt-name { font-weight: 700; font-size: 12px; }
      .tt-sub { color: #6b7280; font-size: 10px; margin-bottom: 6px; }
      .tt-req { color: #d05353; font-size: 10px; margin-bottom: 4px; }
      .tt-mods { color: #6fa8ff; margin-top: 4px; }
      .tt-mods.implicit { color: #9aa3b2; }
      .tt-tier { color: #4a5262; margin-left: 6px; font-size: 10px; }
      .tt-change {
        margin-top: 8px; padding-top: 6px; border-top: 1px solid #262b36;
      }
      .tt-change-label { color: #6b7280; font-size: 10px; margin-bottom: 2px; }
      .tt-change .up { color: #5fbf6a; }
      .tt-change .down { color: #d05353; }

      #keys {
        position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
        z-index: 5; color: #4a5262; font-size: 11px; text-align: center;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud" hidden></div>
    <div id="overlay"></div>
    <div id="inventory" hidden></div>
    <div id="worldmap" hidden></div>
    <div id="chat" hidden></div>
    <div id="dungeon" hidden></div>
    <div id="death" hidden></div>
    <div id="boss" hidden></div>
    <div id="party" hidden></div>
    <div id="social" hidden></div>
    <div id="prompt" hidden></div>
    <div id="settings" hidden></div>
    <div id="vitals" hidden></div>
    <div id="skillbar" hidden></div>
    <div id="buffbar" hidden></div>
    <div id="passives" hidden></div>
    <div id="skills" hidden></div>
    <div id="gathering" hidden></div>
    <div id="crafting" hidden></div>
    <div id="tooltip" hidden></div>
    <div id="keys">
      arrows or WASD to move &middot; space to jump &middot; hold 1-8 or X for skills &middot; hold Z to loot &middot; hold E to gather &middot; R at a station &middot; J skills &middot; K settings &middot; P passives &middot; I inventory &middot; M world map &middot; O social &middot; enter to chat
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
